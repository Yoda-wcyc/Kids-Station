<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>地理單元</title>
<link rel="stylesheet" href="../style.css?v=494b1daab7">
<style>
body{background:var(--bg)}
[hidden]{display:none!important}
.gu{max-width:1000px;margin:0 auto;padding:12px 16px calc(48px + env(safe-area-inset-bottom))}
.gu-head h1{font-size:clamp(1.3rem,1rem + 1.4vw,1.8rem);margin:4px 0 2px}
.gu-head p{margin:0 0 10px}
.btn[aria-selected="true"]{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 3px 0 #d96a22}
.gu-tabs{display:flex;gap:10px;margin:10px 0 14px}
.gu-tabs .btn{flex:1 1 0;min-height:56px;font-size:1.05rem;padding-left:6px;padding-right:6px}
.lc h2{font-size:1.2rem;margin:0 0 8px;line-height:1.6}
.lc p{line-height:1.9;margin:8px 0 0}
.q-text{font-size:clamp(1.08rem,1rem + .5vw,1.28rem);line-height:1.8;font-weight:700;margin:0 0 8px}
.prog{display:flex;flex-wrap:wrap;gap:6px 14px;font-weight:700;margin:4px 0 10px;align-items:center}
.geo-kind{margin-left:auto;background:#eef5ff;border-radius:999px;padding:2px 10px;font-size:.9rem}
.msg{min-height:1.4em;margin:8px 0 0;font-size:1.05rem;font-weight:700;line-height:1.7;color:var(--no)}
.fb{border-radius:12px;padding:10px 14px;margin:10px 0;line-height:1.9}
.fb.ok{background:var(--ok-bg)}.fb.no{background:var(--no-bg)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin:10px 0 0}
.res-tot{font-size:2.6rem;font-weight:900;margin:0}
.ri{border-top:2px dashed var(--line);padding:8px 0;line-height:1.9}
.ri .mk{font-weight:900;margin-right:6px}.ri.ok .mk{color:var(--ok)}.ri.no .mk{color:var(--no)}
.ri .right{font-weight:800;color:#145c38}
.geo-groups{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.geo-grp{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;border:2px solid var(--line);border-radius:16px;padding:12px;background:#fff}
.geo-grp.ok{border-color:var(--ok);background:var(--ok-bg)}
.geo-grp small{color:var(--muted)}
/* 🎬 開場（世界篇）：漫畫在自己的 iframe（geo/intro.html，comic.css 會接管整頁，所以隔開）；地圖在下面（寬螢幕在右邊）跟著亮 */
.gi{display:grid;gap:10px}
.gi-frame{display:block;width:100%;height:62vh;border:0;border-radius:16px;background:#EFEBDD;box-shadow:0 3px 10px rgba(0,0,0,.12)}
@media(min-width:600px){.gi-frame{height:min(72vw,48vh)}}
@media(min-width:1000px) and (min-aspect-ratio:1/1){.gi{grid-template-columns:minmax(0,2.3fr) minmax(0,1fr);align-items:start}.gi-frame{height:min(36vw,70vh)}}   /* 漫畫按鈕在右邊一欄（comic.css 橫向版），格子區要夠寬才會一次放大一格 */
.gi-mapc{margin:0;padding:6px}
#gi-map svg{display:block;margin:0 auto;width:100%;height:auto;max-height:22vh}
@media(min-width:1000px) and (min-aspect-ratio:1/1){#gi-map svg{max-height:60vh}}
.gi-mapc figcaption{margin:6px 4px 2px;font-weight:800;line-height:1.6}
.gh-eps{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0}
.gh-eps .btn{min-height:44px;padding:6px 12px;font-size:.95rem}
</style>
</head>
<body>
<main class="gu">
  <div id="kdone" hidden></div>
  <header class="gu-head">
    <h1 id="title">🌍 地理</h1>
    <p class="muted" id="lede"></p>
  </header>
  <div class="gu-tabs" role="tablist" id="tabs" hidden>
    <button type="button" class="btn" role="tab" id="tab-intro" aria-selected="false" hidden>🎬 開場</button>
    <button type="button" class="btn" role="tab" id="tab-learn" aria-selected="true">📖 重點</button>
    <button type="button" class="btn" role="tab" id="tab-prac" aria-selected="false">✏️ 練習</button>
    <button type="button" class="btn" role="tab" id="tab-exam" aria-selected="false">📝 測驗</button>
  </div>
  <section id="intro" hidden><div class="gi"><div id="gi-comic"></div><figure class="card gi-mapc"><div id="gi-map"></div><figcaption id="gi-cap"></figcaption></figure></div></section>
  <section id="learn" hidden></section>
  <section id="prac" hidden></section>
  <section id="exam" hidden></section>
</main>

<script src="../syncmerge.js?v=e578a07c2e"></script>
<script src="../completion.js?v=39bc9551b3"></script>
<script src="places.js?v=0393f5fbbd"></script>
<script src="maps/tw.js?v=343cf4c0c4"></script>
<script src="maps/world.js?v=28f70987d8"></script>
<script src="geo.js?v=1792145370"></script>
<script src="../comics/catalog.js?v=8418e7f2d1"></script>
<script src="history.js?v=3c22632db2"></script>
<script src="../kids-mistakes.js?v=38bc198597"></script>
<script>
/* 地理單元頁（2026-11-08；引擎 geo/geo.js，規格 geo/CONTRACT.md）。?u=<單元 m1～m5、t1～t6、w1～w7>［&tab=prac|exam］
   單元資料 data/<單元>.js 照網址載（只載這一個單元）；還沒做好的單元顯示「準備中」。
   ?mistakes=1＝📕 錯題練習（2026-11-09）：載錯題庫裡有錯題的那幾個單元，Geo.mkPage 原題型重做。 */
var GEO_U = (/[?&]u=([a-z0-9]+)/.exec(location.search) || [])[1] || '', GEO_MK = /[?&]mistakes=1/.test(location.search);
if (GEO_MK) { try { var GEO_MKU = {}; KidsMistakes.list('geo').forEach(function (e) { var u = e.id.split('-')[0]; if (Geo.UNIT_RE.test(u) && !GEO_MKU[u]) { GEO_MKU[u] = 1; document.write('<script src="data/' + u + '.js"><\/script>'); } }); } catch (e) { } }
else if (Geo.UNIT_RE.test(GEO_U)) document.write('<script src="data/' + GEO_U + '.js"><\/script>');
</script>
<script>
(function () {
  var meta = null;
  try { (KidsCompletion.GEO_UNITS || []).forEach(function (x) { if (x[0] === GEO_U) meta = { title: x[1], group: x[2] }; }); } catch (e) { }
  window.GeoPage = GEO_MK ? Geo.mkPage(document) : Geo.page(document, GEO_U, meta);
})();
</script>
<script>
/* 世界篇（w1～w7）才有：📚 重點頁最後「這一洲的歷史故事」（geo/history.js）＋ 🎬 開場分頁（geo/intro.html 播 geo/comics/<單元>.js）。
   開場看完（翻到最後一格或按「看完了」）記 kids_done.geo.<單元>o＝100（跟著帳號同步；不算題目、不給學習幣）；還沒看過的話，進單元頁先開這個分頁。 */
(function () {
  var G = window.GeoPage, CO = { w1: 'as', w2: 'eu', w3: 'af', w4: 'na', w5: 'sa', w6: 'oc', w7: 'an' }[GEO_U];
  if (!G || !CO) return;
  var $ = function (id) { return document.getElementById(id); }, esc = Geo.esc;
  try {
    var list = GeoHistory.byCo(CO, GeoPlaces, COMIC_CATALOG).filter(function (e) { return e.ready; });
    $('go-prac').parentNode.insertAdjacentHTML('beforebegin', '<div class="card" id="geo-history"><h2 style="margin:0 0 6px">📚 這一洲的歷史故事</h2>' +
      (list.length ? '<p style="margin:0">世界史漫畫《時光搖搖車》有 ' + list.length + ' 話發生在這一洲：</p><div class="gh-eps">' + list.map(function (e) { return '<a class="btn" href="../comics/' + e.id + '.html">' + e.vol + '-' + e.ep + ' ' + esc(e.t) + '</a>'; }).join('') + '</div>'
        : '<p style="margin:0">漫畫裡還沒有發生在這一洲的故事，到歷史地圖看看別的洲吧。</p>') +
      '<p style="margin:10px 0 0"><a class="btn" href="history.html">🗺️ 看歷史地圖</a></p></div>');
  } catch (e) { }
  var key = GEO_U + 'o', tab = $('tab-intro'), frame = null;
  function seen() { try { var d = JSON.parse(localStorage.getItem('kids_done') || 'null'); return !!(d && d.geo && d.geo[key]); } catch (e) { return false; } }
  function label() { tab.textContent = '🎬 開場' + (seen() ? ' ✓' : ''); }
  function record() { try { if (window.KidsDone) KidsDone.record('geo', key, 100); } catch (e) { } label(); }
  function show() {
    if (!frame) { frame = document.createElement('iframe'); frame.className = 'gi-frame'; frame.title = '開場漫畫'; frame.src = 'intro.html?u=' + GEO_U; $('gi-comic').appendChild(frame); }
    G.setTab('intro');
  }
  // 這一格提到的地點在地圖上亮起來；不在這一洲的範圍裡（例 在臺灣的家）就換成世界地圖
  function map(places, fig) {
    var f = Object.assign({}, fig || { map: 'world' }), V = Geo.view(f), xy = function (id) { return Geo.pinXY(id, V); };
    var inside = function (s) { return s && (V.polar ? Math.hypot(s.x - V.w / 2, s.y - V.h / 2) <= V.w / 2 - 14 : s.x >= 0 && s.y >= 0 && s.x <= V.w && s.y <= V.h); };
    if (!places.every(function (id) { return inside(xy(id)); })) { f = { map: 'world', box: [-180, -60, 180, 84] }; V = Geo.view(f); }
    f.cont = true; f.compass = false; f.names = places.filter(function (id) { return GeoPlaces[id]; });
    f.svg = f.names.map(function (id) {
      var s = Geo.pinXY(id, V), r = s.r;
      return '<g class="gi-on" data-p="' + id + '"><circle cx="' + s.x + '" cy="' + s.y + '" r="' + r + '" fill="rgba(255,138,61,.28)" stroke="#ff6a00" stroke-width="4"><animate attributeName="r" values="' + (r * .7) + ';' + (r * 1.2) + ';' + (r * .7) + '" dur="1.6s" repeatCount="indefinite"/></circle><circle cx="' + s.x + '" cy="' + s.y + '" r="6" fill="#e5484d" stroke="#fff" stroke-width="2"/></g>';
    }).join('');
    f.alt = '地圖：' + (f.names.length ? f.names.map(function (id) { return GeoPlaces[id].n; }).join('、') + ' 亮起來' : '這一格沒有標地點');
    $('gi-map').innerHTML = Geo.figSVG({ type: 'mc', fig: f }, {}, false);
    $('gi-cap').textContent = f.names.length ? '📍 這一格在：' + f.names.map(function (id) { return GeoPlaces[id].n; }).join('、') : '📍 這一格沒有標地點';
  }
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (e.origin !== location.origin || !d || d.geoIntro !== GEO_U || !frame || e.source !== frame.contentWindow) return;
    if (d.k === 'step') { map(d.places || [], d.fig); if (d.i >= d.n - 1) record(); }
    if (d.k === 'end') { record(); G.setTab('learn'); }
  });
  tab.hidden = false; tab.onclick = show; label();
  if (!/[?&]tab=/.test(location.search) && !seen()) show();
  G.intro = { show: show, map: map, seen: seen };   // 測試用
})();
</script>
<script src="../kids-auth.js?v=42d7c72a13"></script>
<script src="../kids-coins.js?v=94d7e71619"></script>
<script src="../kids-daily.js?v=79c5f7d15c"></script>
<script src="../kids-done.js?v=de42d7120a"></script>
<script src="../syncauto.js?v=d7ed49f73e"></script>
<script src="../sync.js?v=12631d8738"></script>
<script>try { if (window.GeoPage && !GEO_MK && window.KidsDone) KidsDone.mount(document.getElementById('kdone'), 'geo:' + GEO_U, {}); } catch (e) { }</script>
</body>
</html>
