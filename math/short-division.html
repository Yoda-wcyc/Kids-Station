<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>短除法：最大公因數・最小公倍數</title>
<link rel="stylesheet" href="../style.css?v=61843c4a77">
<style>
:root{--g:#2477c9;--g-bg:#d6ecff;--l:#d2601a;--l-bg:#ffe1c4;--bfs:clamp(30px,4.2vw + 12px,46px)}
body{background:var(--bg)}
.sd{max-width:1000px;margin:0 auto;padding:12px 16px calc(48px + env(safe-area-inset-bottom))}
.sd-head h1{font-size:clamp(1.35rem,1rem + 1.4vw,1.8rem);margin:4px 0 2px}
.sd-head p{margin:0 0 10px}
.sd-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.sd-bar .lab{font-weight:700;color:var(--muted);font-size:.95rem;margin-right:2px}
.btn[aria-pressed="true"],.btn[aria-selected="true"]{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 3px 0 #d96a22}
.btn.sm{min-height:44px;padding:6px 14px;font-size:.95rem}
.sd-tabs{display:flex;gap:10px;margin:10px 0 14px}
.sd-tabs .btn{flex:1 1 0;min-height:56px;font-size:1.15rem}
[hidden]{display:none!important}
.sd-in-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.num-in{width:5.2em;min-height:56px;font:inherit;font-size:1.5rem;font-weight:700;text-align:center;border:3px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-variant-numeric:tabular-nums}
.num-in:focus{outline:none;border-color:var(--pri)}
.sd-err{color:var(--no);font-weight:700;margin:8px 0 0}
.sd-err:empty{display:none}
@media (max-width:600px){.sd-head{padding-right:84px}}
.sd-rule{font-size:1rem;line-height:1.6}
.sd-rule p{margin:4px 0}
.sd-rule .on{background:#fff2dd;border-radius:10px;padding:4px 8px}
.sd-stage{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.sd-stage{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}}
.sd-boardcard{display:flex;flex-direction:column;align-items:center;overflow-x:auto;min-height:200px;justify-content:center}
/* 短除法版式：左欄除數（右邊直線）、右邊被除數（下面橫線），最後一列＝停下來的商 */
.sd-grid{display:inline-grid;font-size:var(--bfs);line-height:1.2;font-variant-numeric:tabular-nums lining-nums;font-weight:600;margin:6px auto}
.sd-c{padding:.1em .42em;text-align:center;min-width:1.7em;min-height:1.4em;display:flex;align-items:center;justify-content:center}
.sd-dv{justify-content:flex-end;color:var(--l);font-weight:800;min-width:1.4em;padding-right:.3em}
.sd-dv.br{border-right:3px solid var(--ink)}
.sd-n.br{border-bottom:3px solid var(--ink)}
.sd-n.cp{color:var(--muted)}
.sd-n.cp::after{content:"↓";font-size:.4em;margin-left:.1em;align-self:flex-start;color:var(--muted)}
.sd-c.hg{background:var(--g-bg);color:var(--g)}
.sd-c.hl{background:var(--l-bg)}
.sd-c.new{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sd-c.new{animation:none}}
.sd-stamp{display:inline-block;margin:8px 0 2px;font-weight:800;font-size:1.2rem;color:var(--no);border:3px double var(--no);border-radius:12px;padding:2px 14px;transform:rotate(-4deg)}
.sd-in{width:2.9em;min-height:44px;font:inherit;font-size:1em;font-weight:700;text-align:center;border:3px dashed var(--pri);border-radius:10px;background:#fffaf2;color:var(--ink);padding:0;font-variant-numeric:tabular-nums}
.sd-in.wide{width:3.8em}
.sd-in:focus{outline:none;border-style:solid;background:#fff}
.sd-in.bad{border-color:var(--no);background:var(--no-bg)}
.sd-say{font-size:clamp(1.15rem,1rem + .5vw,1.35rem);line-height:1.6;margin:0 0 8px;font-weight:600}
.sd-say b{background:linear-gradient(transparent 58%,#ffe36e 58%)}
.sd-note{margin:6px 0;color:var(--ok);font-weight:700}
.sd-f{margin:6px 0;font-size:clamp(1.1rem,1rem + .5vw,1.3rem);font-weight:700;padding:6px 10px;border-radius:12px}
.sd-f.g{background:var(--g-bg);color:var(--g)}
.sd-f.l{background:var(--l-bg);color:#8a3b0b}
.sd-f.c{background:var(--ok-bg);color:#1b7a47}
.sd-ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}
.sd-ctl .info{margin-left:auto;color:var(--muted);font-size:.95rem}
.sd-chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.sd-chips .btn{min-width:56px;font-size:1.15rem}
.sd-prog{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-weight:700;margin:4px 0 10px}
.sd-ask{font-size:clamp(1.15rem,1rem + .6vw,1.4rem);font-weight:800;margin:0 0 4px;text-align:center}
.sd-act p{margin:0 0 8px;font-size:1.1rem;line-height:1.55}
.sd-act .row{margin:8px 0 0;flex-wrap:wrap}
.sd-msg{min-height:1.6em;margin:10px 0 0;font-size:1.15rem;font-weight:700}
.sd-msg.bad{color:var(--no)}
.sd-msg.good{color:var(--ok)}
.sd-ans{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:1.3rem;font-weight:700}
.sd-end .big{font-size:3rem;margin:0}
.sd-end .score{font-size:2rem;font-weight:800}
.sd-end .row{justify-content:center;flex-wrap:wrap}
.sd-mk{border:3px solid var(--pri);background:#fff6ec}
/* 📝 應用題 */
.w-text{font-size:clamp(1.2rem,1rem + .7vw,1.45rem);line-height:2.15;margin:0}
.wtok{font:inherit;font-weight:800;min-width:48px;min-height:44px;padding:0 .35em;margin:2px;border:3px dashed var(--pri);border-radius:12px;background:#fffaf2;color:var(--ink);cursor:pointer;vertical-align:middle;line-height:1.15;touch-action:manipulation;font-variant-numeric:tabular-nums}
.wtok[aria-pressed="true"]{background:var(--pri);border-style:solid;border-color:var(--pri);color:#fff}
.wnum{font-weight:800;padding:0 .12em;font-variant-numeric:tabular-nums}
.wnum.key{background:#ffe36e;border-radius:8px;padding:0 .3em}
.w-ask{font-weight:800;font-size:clamp(1.15rem,1rem + .6vw,1.4rem);margin:10px 0 0;line-height:1.6}
.w-ask.sub{color:#8a3b0b}
.w-kind{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0}
.btn.w-kbtn{min-height:84px;font-size:clamp(1.15rem,1rem + 1vw,1.6rem);font-weight:800}
.w-kbtn.g{border-color:var(--g);color:var(--g);box-shadow:0 3px 0 var(--g)}
.w-kbtn.l{border-color:var(--l);color:var(--l);box-shadow:0 3px 0 var(--l)}
.w-tag{display:inline-block;font-weight:800;border-radius:10px;padding:2px 10px;margin:6px 6px 0 0;font-size:1rem}
.w-tag.g{background:var(--g-bg);color:var(--g)}
.w-tag.l{background:var(--l-bg);color:#8a3b0b}
.w-tag.k{background:#fff2b8;color:#6b5200}
.w-hint{background:#fff2dd;border-radius:12px;padding:8px 12px;line-height:1.7;font-weight:700;color:#8a3b0b;margin:8px 0 0}
.w-hint:empty{display:none}
.w-done{margin:4px 0;color:#1b7a47;font-weight:700}
.num-in.sm{width:3.4em}
.w-units .btn{min-width:72px}
@media (max-width:600px){.w-kind{grid-template-columns:1fr}}
</style>
</head>

<main class="sd">
  <header class="sd-head">
    <h1 id="title">🧮 短除法：最大公因數・最小公倍數</h1>
    <p class="muted" id="lede">用短除法一步一步找出最大公因數和最小公倍數。先看步驟，再換你算，最後挑戰生活應用題！</p>
  </header>

  <div class="sd-bar" id="lv" role="group" aria-label="難度">
    <span class="lab">難度</span>
    <button type="button" class="btn sm" data-lv="l20" aria-pressed="true">20 以內</button>
    <button type="button" class="btn sm" data-lv="l100" aria-pressed="false">100 以內</button>
    <button type="button" class="btn sm" data-lv="l3d" aria-pressed="false">三位數</button>
    <button type="button" class="btn sm" data-lv="tri" aria-pressed="false">三個數（六年級）</button>
  </div>

  <div class="sd-tabs" role="tablist" id="tabs">
    <button type="button" class="btn" role="tab" id="tab-see" aria-selected="true" aria-controls="see">📖 看步驟</button>
    <button type="button" class="btn" role="tab" id="tab-try" aria-selected="false" aria-controls="try">✏️ 換你算</button>
    <button type="button" class="btn" role="tab" id="tab-word" aria-selected="false" aria-controls="word">📝 應用題</button>
  </div>

  <!-- ================= 📖 看步驟（免登入） ================= -->
  <section id="see" role="tabpanel" aria-labelledby="tab-see">
    <div class="card">
      <div class="sd-in-row">
        <input class="num-in" id="n0" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="4" aria-label="第一個數" value="12">
        <input class="num-in" id="n1" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="4" aria-label="第二個數" value="18">
        <input class="num-in" id="n2" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="4" aria-label="第三個數" value="30" hidden>
        <button type="button" class="btn primary" id="see-go">開始畫 ▶</button>
        <button type="button" class="btn" id="see-rand">🎲 隨機出題</button>
      </div>
      <div class="sd-bar" id="see-mode" role="group" aria-label="三個數要找什麼" hidden>
        <button type="button" class="btn sm" data-m="gcd" aria-pressed="true">找最大公因數</button>
        <button type="button" class="btn sm" data-m="lcm" aria-pressed="false">找最小公倍數</button>
      </div>
      <p class="sd-err" id="see-err" role="alert"></p>
    </div>
    <div class="card sd-rule" id="see-rule"></div>
    <div class="sd-stage">
      <div class="card sd-boardcard"><div id="see-board"></div><div id="see-stamp"></div></div>
      <div class="card">
        <p class="sd-say" id="see-say" aria-live="polite"></p>
        <div id="see-alt"></div>
        <div id="see-result"></div>
      </div>
    </div>
    <div class="sd-ctl">
      <button type="button" class="btn" id="see-prev">◀ 上一步</button>
      <button type="button" class="btn primary" id="see-next">下一步 ▶</button>
      <button type="button" class="btn" id="see-play">▶ 自動播放</button>
      <span class="info" id="see-info"></span>
    </div>
  </section>

  <!-- ================= ✏️ 換你算（要登入） ================= -->
  <section id="try" role="tabpanel" aria-labelledby="tab-try" hidden>
    <div class="card center" id="try-start"></div>
    <div id="try-q" hidden>
      <div class="sd-prog" id="try-prog"></div>
      <div class="card sd-boardcard">
        <p class="sd-ask" id="try-ask"></p>
        <div id="try-board"></div>
      </div>
      <div class="card sd-act" id="try-act"></div>
      <p class="sd-msg" id="try-msg" role="status" aria-live="polite"></p>
    </div>
    <div class="card center sd-end" id="try-end" hidden></div>
  </section>

  <!-- ================= 📝 應用題（看題免登入、作答要登入） ================= -->
  <section id="word" role="tabpanel" aria-labelledby="tab-word" hidden>
    <div class="card center" id="w-start"></div>
    <div id="w-q" hidden>
      <div class="sd-prog" id="w-prog"></div>
      <div class="card" id="w-card">
        <p class="w-text" id="w-text"></p>
        <div id="w-tags"></div>
        <div id="w-asks"></div>
      </div>
      <div class="card sd-act" id="w-act"></div>
      <p class="sd-msg" id="w-msg" role="status" aria-live="polite"></p>
    </div>
    <div class="card center sd-end" id="w-end" hidden></div>
  </section>
</main>

<script>
(function () {
'use strict';
/* 短除法頁面。演算法（純函式）在 short-division.js（window.SD）。
   📖 看步驟：免登入；✏️ 換你算：KidsAuth.requireLogin＋startActivity('math')，每一步 KidsCoins.answer(ok,'math')，
   一輪 5 題送 practice_round 'math:gcd'（correct＝一次就全對的題數）。有答錯的題收進數學錯題庫（id 'gcd:<數字>[:模式]'，p.type='gcd'）。
   📝 應用題：看題免登入；作答要登入（requireLogin＋第一次作答時 startActivity('math')）。題目模板在 gcd-word.js（window.GW）。
   每題四步：① 判斷最大公因數／最小公倍數 → ② 從題目選出要短除的數（點數字或填空，干擾數字要分得出來）→ ③ 短除法（可「我會了，直接填答案」跳過，
   但只要第 ④ 步答錯就要展開短除）→ ④ 回答（數字＋單位；有追問再答）。每步 KidsCoins.answer(ok,'math')；一輪 5 題送 practice_round 'math:gcdword'。
   有任何一步錯的題收進數學錯題庫：id 'gcdword:<模板>:<數字>'，p＝{type:'gcdword', t:模板, v:[數字], q:顯示文字}，用同樣的數字原題重做。
   ?mistakes=1（首頁數學錯題庫「只練錯題」）：只重做 type 'gcd' 的錯題，做完送 practice_round 'math:mistakes'；沒有 'gcd' 只有 'gcdword' 時直接改練應用題錯題。
   ?mistakes=word：只重做 type 'gcdword' 的應用題錯題，做完一樣送 'math:mistakes'。 */
var $ = function (id) { return document.getElementById(id); };
var MKQ = (/[?&]mistakes=(1|word)(?:&|$)/.exec(location.search) || [])[1] || '';
var MK = MKQ === '1', MKW = MKQ === 'word';
var LV_N = { l20: 2, l100: 2, l3d: 2, tri: 3 };
var LV_NAME = { l20: '20 以內', l100: '100 以內', l3d: '三位數', tri: '三個數' };
var ROUND = 5;
var S = { lv: 'l20', tab: 'see', see: { nums: [12, 18], mode: 'both', pick: {}, P: null, P0: null, steps: [], i: 0, timer: null, alt: false, note: '' } };
var T = null;   // 換你算這一輪
window.SDPage = { S: S, T: function () { return T; } };   // 測試用

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function times(xs) { return xs.join('×'); }
function andJoin(xs) { return xs.length <= 2 ? xs.join(' 和 ') : xs.slice(0, -1).join('、') + ' 和 ' + xs[xs.length - 1]; }
function nameOf(m) { return m === 'gcd' ? '最大公因數' : m === 'lcm' ? '最小公倍數' : '最大公因數和最小公倍數'; }
function last(a) { return a[a.length - 1]; }
function coinAnswer(ok) { try { if (window.KidsCoins) KidsCoins.answer(!!ok, 'math'); } catch (e) { } }
function coinAct() { try { if (window.KidsCoins) KidsCoins.activity('math'); } catch (e) { } }
function authOK() { try { return !window.KidsAuth || KidsAuth.requireLogin('math'); } catch (e) { return true; } }
function reduced() { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } }

/* ---------- 短除法版式（CSS grid）----------
   rows：[{d:除數 html（''＝沒有）, br:畫短除號, dc:除數格 class, cells:[{h:html, c:class}]}] */
function boardHTML(n, rows, label) {
  var h = '<div class="sd-grid" style="grid-template-columns:auto repeat(' + n + ',auto)" role="group" aria-label="' + esc(label || '短除法') + '">';
  rows.forEach(function (r) {
    h += '<div class="sd-c sd-dv' + (r.br ? ' br' : '') + (r.dc ? ' ' + r.dc : '') + '">' + (r.d == null ? '' : r.d) + '</div>';
    r.cells.forEach(function (c) { h += '<div class="sd-c sd-n' + (r.br ? ' br' : '') + (c.c ? ' ' + c.c : '') + '">' + c.h + '</div>'; });
  });
  return h + '</div>';
}
/* 版面資料：rowsShown 列、前 divsShown 列有除數；hl＝'g'（左欄）｜'l'（L 形）；newDiv／newRow＝剛出現的格子 */
function boardRows(P, rowsShown, divsShown, hl, newDiv, newRow) {
  var out = [];
  for (var r = 0; r < rowsShown; r++) {
    var hasD = r < divsShown, isLast = r === rowsShown - 1;
    var dc = (hl === 'g' && hasD) ? 'hg' : (hl === 'l' && (hasD || isLast)) ? 'hl' : '';
    if (hasD && newDiv === r) dc += ' new';
    out.push({ d: hasD ? P.divs[r] : '', br: hasD, dc: dc, cells: P.rows[r].map(function (x, j) {
      var c = (r > 0 && P.copied[r - 1][j]) ? 'cp' : '';
      if (hl === 'l' && isLast) c += ' hl';
      if (newRow === r) c += ' new';
      return { h: x, c: c };
    }) });
  }
  return out;
}

/* ================= 📖 看步驟 ================= */
function ruleHTML(mode, n) {
  if (n === 2) return '<p><b>兩個數的短除法：</b>找一個兩個數都能整除的數（公因數）寫在左邊，商寫在下面；一直除到剩下的兩個數<b>互質</b>（除了 1 沒有其他公因數）就停。</p>' +
    '<p>🔵 最大公因數＝左邊所有除數相乘　🟠 最小公倍數＝左邊所有除數 × 最底下一列（L 形）</p>';
  return '<p class="' + (mode === 'gcd' ? 'on' : '') + '">🔵 <b>找最大公因數：</b>要<b>三個數都能整除</b>才能除；三個數沒有共同的公因數就停（就算其中兩個數還有公因數也不用管）。答案＝左邊所有除數相乘。</p>' +
    '<p class="' + (mode === 'lcm' ? 'on' : '') + '">🟠 <b>找最小公倍數：</b>只要<b>其中兩個數</b>有公因數就繼續除，<b>除不盡的那個數照抄</b>到下一列；<b>每兩個數都互質</b>才停。答案＝左邊所有除數 × 最底下一列（L 形）。</p>';
}
function seeBuild() {
  var s = S.see;
  s.P = SD.plan(s.nums, s.mode, s.pick);
  s.P0 = SD.plan(s.nums, s.mode);
  var st = [{ k: 'start' }];
  s.P.divs.forEach(function (d, i) { st.push({ k: 'div', i: i }, { k: 'quot', i: i }); });
  st.push({ k: 'stop' });
  if (s.P.mode !== 'lcm') st.push({ k: 'gcd' });
  if (s.P.mode !== 'gcd') st.push({ k: 'lcm' });
  if (s.P.mode === 'both') st.push({ k: 'check' });
  s.steps = st;
  if (s.i >= st.length) s.i = st.length - 1;
}
function divSay(P, i) {
  var row = P.rows[i], d = P.divs[i], m = P.mode, prime = SD.isPrime(d), yes = row.filter(function (x) { return x % d === 0; }), no = row.filter(function (x) { return x % d !== 0; });
  var def = S.see.P0.divs[i] === d && !S.see.pick[i];
  var t = (m === 'lcm' ? andJoin(yes) + ' 能被 <b>' + d + '</b> 整除' : (row.length === 3 ? '三個數 ' : '') + andJoin(row) + ' 都能被 <b>' + d + '</b> 整除') + '，把 ' + d + ' 寫在左邊。';
  if (def && prime) t += '（' + d + ' 是' + (m === 'lcm' && no.length ? '能整除兩個數的' : '它們共同的') + '最小質因數）';
  else if (!prime) t += '（' + d + ' 不是質數也可以，只要是公因數就行）';
  if (no.length) t += '<br>' + andJoin(no) + ' 不能被 ' + d + ' 整除，等一下照抄。';
  return t;
}
function quotSay(P, i) {
  var row = P.rows[i], d = P.divs[i], parts = [], cp = [];
  row.forEach(function (x) { if (x % d === 0) parts.push(x + '÷' + d + '＝' + (x / d)); else cp.push(x); });
  return parts.join('、') + (cp.length ? '；' + cp.join('、') + ' 除不盡，照抄下來' : '') + '。商寫在下面。';
}

  if (v == null) { wMsg('先寫一個數字喔！'); return; }
  var exp = pd.kind === 'gcd' ? D : D * SD.prod(row), ok = v === exp;
  coinAnswer(ok);
  if (!ok) { wWrong(); wMsg(ansHint(pd.kind, pd.divs, row), 'bad'); selectIn('w-in-v'); return; }
  Q.sdDone = true; Q.phase = 'ans'; Q.forced = false;
  wRender(true);
  wMsg('✓ ' + nameOf(pd.kind) + '是 ' + v + '！現在回答問題（別忘了單位）。', 'good');
}
function wSkip() {
  if (!wAuth()) return;
  var Q = W.Q; Q.skip = true; Q.phase = 'ans';
  wRender(true); wMsg('好！直接回答，答錯的話要回來把短除法做完喔。');
}
function wAns() {
  if (!wAuth()) return;
  var Q = W.Q, p = Q.p, sub = wSub(Q), ok, shown, numOk = false;
  if (sub.time) {
    var h = readInt('w-in-h'), m = readInt('w-in-m');
    if (h == null || m == null) { wMsg('「點」和「分」都要寫喔！'); return; }
    ok = h === sub.time.h && m === sub.time.m; shown = '早上 ' + h + ' 點 ' + m + ' 分';
  } else {
    var v = readInt('w-in-a');
    if (v == null) { wMsg('先寫數字喔！'); return; }
    if (!Q.unit) { wMsg('再選一個單位喔！'); return; }
    numOk = v === sub.ans; ok = numOk && Q.unit === sub.unit; shown = v + ' ' + Q.unit;
  }
  coinAnswer(ok);
  if (!ok) {
    wWrong();
    if (!Q.sdDone) {   // 跳過短除法又答錯 → 一定要展開短除法
      Q.forced = true; Q.phase = 'sd'; if (!Q.pad) Q.pad = padNew(p);
      wRender(true); wMsg('答錯了，沒關係！先用短除法算算看。', 'bad'); return;
    }
    wMsg(numOk ? '數字對了！單位再想想：' + sub.q : sub.hint, 'bad');
    selectIn(sub.time ? 'w-in-h' : 'w-in-a'); return;
  }
  Q.done.push(sub.q + ' → ' + shown);
  Q.ai++; Q.unit = ''; Q.uorder = null;
  if (Q.ai <= p.follow.length) { wRender(true); wMsg('✓ 答對了！還有一個追問。', 'good'); return; }
  Q.phase = 'done';
  if (!Q.wrong) { W.ok++; if (wRec(Q, true) === 'graduated') W.grad++; }
  wRender(false); wMsg('');
}
function wEnd() {
  var n = W.items.length;
  if (!W.sent) { W.sent = true; try { if (window.KidsCoins) KidsCoins.report({ type: 'practice_round', item: W.mk ? 'math:mistakes' : 'math:gcdword', correct: W.ok, total: n }); } catch (e) { } }
  var gLeft = mkLeft('gcd'), eqLeft = mkLeft('eq');
  $('w-q').hidden = true; $('w-end').hidden = false;
  $('w-end').innerHTML = '<p class="big">' + (W.ok === n ? '🏆' : '💪') + '</p><p class="score" id="w-score">' + W.ok + ' / ' + n + '</p><p>一次就全對 ' + W.ok + ' 題' +
    (W.grad ? '，🎓 有 ' + W.grad + ' 題錯題畢業了！' : (W.ok < n ? '；答錯的題在 📕 錯題庫等你復仇。' : '！')) + '</p><div class="row">' +
    (W.mk ? '<a class="btn primary" id="mk-back" target="_top" href="../index.html#s/math/mistakes">📕 回錯題庫</a>' + (gLeft ? '<a class="btn" id="mk-gcd" href="short-division.html?mistakes=1">接著練短除法錯題 ▶</a>' : '') + (eqLeft ? '<a class="btn" href="balance.html?mistakes=1">接著練天平錯題 ▶</a>' : '')
      : '<button type="button" class="btn primary big" id="w-again">再來一輪 ▶</button><a class="btn" target="_top" href="../index.html#s/math/mistakes">📕 錯題庫</a>') + '</div>';
}
$('word').addEventListener('click', function (e) {
  var t = e.target.closest('[data-ti],[data-wk],[data-u],[data-wlv],[data-wcat],button'); if (!t) return;
  if (t.hasAttribute('data-wlv')) { WS.lv = t.getAttribute('data-wlv'); $('w-start').innerHTML = wStartHTML(); return; }
  if (t.hasAttribute('data-wcat')) { WS.cat = t.getAttribute('data-wcat'); $('w-start').innerHTML = wStartHTML(); return; }
  if (t.id === 'w-go') { wStart(); return; }
  if (t.id === 'w-again') { wHome(); return; }
  if (!W || !W.Q) return;
  if (t.hasAttribute('data-ti')) { if (W.Q.phase === 'pick') wTok(+t.getAttribute('data-ti')); return; }
  if (t.hasAttribute('data-wk')) { wKind(t.getAttribute('data-wk')); return; }
  if (t.hasAttribute('data-u')) {
    W.Q.unit = t.getAttribute('data-u');
    Array.prototype.forEach.call($('w-units').querySelectorAll('[data-u]'), function (b) { b.setAttribute('aria-pressed', String(b === t)); });
    return;
  }
  if (t.id === 'w-ok-pick') wPick();
  else if (t.id === 'w-ok-d') wDiv();
  else if (t.id === 'w-stop') wStop();
  else if (t.id === 'w-ok-q') wQuot();
  else if (t.id === 'w-ok-v') wVal();
  else if (t.id === 'w-skip') wSkip();
  else if (t.id === 'w-ok-a') wAns();
  else if (t.id === 'w-next') { W.idx++; if (W.idx >= W.items.length) wEnd(); else { wQ(); window.scrollTo(0, 0); } }
});
$('word').addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' || !W || !W.Q) return;
  var id = e.target.id || ''; if (!/^w-/.test(id)) return;
  e.preventDefault();
  var nx;
  if (/^w-k\d$/.test(id)) { nx = $('w-k' + (+id.slice(3) + 1)); if (nx && !String(nx.value).trim()) nx.focus(); else wPick(); }
  else if (id === 'w-in-d') wDiv();
  else if (/^w-in-q/.test(id)) { nx = $('w-in-q' + (+id.slice(6) + 1)); if (nx && !String(nx.value).trim()) nx.focus(); else wQuot(); }
  else if (id === 'w-in-v') wVal();
  else if (id === 'w-in-h') $('w-in-m').focus();
  else if (id === 'w-in-a' || id === 'w-in-m') wAns();
});
$('word').addEventListener('input', function (e) {
  if (e.target.classList && e.target.classList.contains('bad')) e.target.classList.remove('bad');
  if (W && W.Q && W.Q.phase === 'pick' && /^w-k\d$/.test(e.target.id || '')) wSyncFromInputs();
});
function wordMkItems() {
  var items = [];
  try {
    KidsMistakes.list('math').forEach(function (e) {
      var p = e.p || {}; if (p.type !== 'gcdword' || items.length >= 30) return;
      var q = GW.build(p.t, p.v); if (q) items.push(q);
    });
  } catch (e) { }
  return items;
}

/* ================= 分頁、難度 ================= */
function setTab(k) {
  if (k === 'try' && !authOK()) return;   // 換你算要登入（看步驟、應用題的看題免登入）
  S.tab = k; seeStop();
  $('tab-see').setAttribute('aria-selected', String(k === 'see'));
  $('tab-try').setAttribute('aria-selected', String(k === 'try'));
  $('tab-word').setAttribute('aria-selected', String(k === 'word'));
  $('see').hidden = k !== 'see'; $('try').hidden = k !== 'try'; $('word').hidden = k !== 'word';
  $('lv').hidden = k === 'word';   // 應用題有自己的難度（基本／進階）
  if (k === 'try' && !T) tryHome();
  if (k === 'word' && !W) wHome();
  if (k === 'see') seeRender();
}
$('tab-see').onclick = function () { setTab('see'); };
$('tab-try').onclick = function () { setTab('try'); };
$('tab-word').onclick = function () { setTab('word'); };
$('lv').addEventListener('click', function (e) {
  var b = e.target.closest('[data-lv]'); if (!b) return;
  var lv = b.getAttribute('data-lv'); if (lv === S.lv) return;
  S.lv = lv;
  Array.prototype.forEach.call($('lv').querySelectorAll('[data-lv]'), function (x) { x.setAttribute('aria-pressed', String(x === b)); });
  var mode = lv === 'tri' ? (S.see.mode === 'lcm' ? 'lcm' : 'gcd') : 'both';
  seeLoad(lv === 'tri' && S.see.nums.length !== 3 ? [12, 18, 30] : SD.generate(lv, { mode: mode }), mode);
  if (T && !T.mk) T = null;
  if (S.tab === 'try') tryHome();
});

/* ================= 啟動 ================= */
seeLoad([12, 18], 'both');
if (MK && !mkLeft('gcd') && mkLeft('gcdword')) { MK = false; MKW = true; }   // 只有應用題錯題 → 直接練應用題錯題
if (MKW) {
  /* 應用題錯題練習：type 'gcdword'，用同樣的模板＋數字原題重做（最多 30 題、最近答錯的先） */
  var witems = wordMkItems();
  document.title = '應用題錯題練習';
  $('title').textContent = '📕 應用題錯題練習';
  $('lede').textContent = '答錯過的應用題，用一樣的數字再做一次。同一題連續全對 3 次就會畢業 🎓';
  $('lv').hidden = true; $('tabs').hidden = true; $('see').hidden = true; $('try').hidden = true; $('word').hidden = false; S.tab = 'word';
  W = { items: witems, idx: 0, ok: 0, grad: 0, sent: false, mk: true, act: true, lv: 'basic', cat: 'mix' };   // 練習額度在錯題庫按「只練錯題」時已經算過
  if (witems.length) wQ();
  else {
    $('w-q').hidden = true;
    $('w-start').className = 'card center sd-mk';
    $('w-start').innerHTML = '<p id="mk-empty">目前沒有應用題錯題 🎉</p><a class="btn primary" target="_top" href="../index.html#s/math/mistakes">📕 回錯題庫</a>';
  }
}
if (MK) {
  /* 錯題練習：只做 type 'gcd' 的數學錯題（最多 30 題、最近答錯的先） */
  var items = [];
  try {
    KidsMistakes.list('math').forEach(function (e) {
      var p = e.p || {}, xs = p.nums;
      if (p.type !== 'gcd' || !Array.isArray(xs) || (xs.length !== 2 && xs.length !== 3) || items.length >= 30) return;
      if (!xs.every(function (x) { return typeof x === 'number' && Math.floor(x) === x && x >= 1 && x <= 9999; })) return;
      items.push({ nums: xs.slice(), mode: SD.modeOf(xs, p.mode) });
    });
  } catch (e) { }
  document.title = '短除法錯題練習';
  $('title').textContent = '📕 短除法錯題練習';
  $('lede').textContent = '答錯過的短除法題目，再做一次。同一題連續全對 3 次就會畢業 🎓';
  $('lv').hidden = true; $('tabs').hidden = true; $('see').hidden = true; $('try').hidden = false; S.tab = 'try';
  T = { items: items, idx: 0, ok: 0, grad: 0, sent: false, mk: true, lv: S.lv };
  if (items.length) { $('try').className = ''; tryQ(); }
  else {
    $('try-q').hidden = true;
    $('try-start').className = 'card center sd-mk';
    $('try-start').innerHTML = '<p id="mk-empty">目前沒有短除法錯題 🎉</p><a class="btn primary" target="_top" href="../index.html#s/math/mistakes">📕 回錯題庫</a>';
  }
}
})();
</script>
