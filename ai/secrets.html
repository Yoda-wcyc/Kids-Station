<style>
*{box-sizing:border-box;margin:0;padding:0}

body{font-family:-apple-system,'PingFang TC','Noto Sans TC','Segoe UI',sans-serif;background:linear-gradient(160deg,#8ed7ff 0%,#bfeaff 40%,#fff4d6 100%);min-height:100vh;color:#2a3550}

.q{font-size:17px;font-weight:700;line-height:1.6;margin:0.3rem 0 0.9rem;text-align:center;color:#22314f}
.opts{display:flex;flex-direction:column;gap:0.6rem;width:100%}

.opt:hover{border-color:#ff9f43;transform:translateY(-2px)}

.opt.dim{opacity:.45}
.btn{background:linear-gradient(135deg,#ff9f43,#ff7e5f);color:#fff;border:none;border-radius:40px;padding:0.85rem 2.6rem;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 6px 16px rgba(255,126,80,0.35);margin-top:1rem;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.peek{background:none;border:none;color:#5b7aa8;font-size:13px;text-decoration:underline;cursor:pointer;margin-top:0.9rem}
.fb{background:#fff8ec;border:2px solid #ffe0b3;border-radius:14px;padding:0.9rem 1.1rem;font-size:15px;line-height:1.7;margin-top:0.9rem;width:100%;text-align:left}
.fb.good{background:#e9fbf2;border-color:#a8ecc9}
.parent{background:rgba(255,255,255,0.7);border:1.5px dashed #a9c4e0;border-radius:14px;padding:0.85rem 1rem;font-size:13px;line-height:1.7;color:#42597a;margin-top:1.1rem;width:100%;text-align:left}

<script>
const GAME = {"title": "小朋友學 AI · 祕密不能說", "opening": [{"m": "talk", "t": "嗨！我是 <b>Yoda</b> 👋 這一課我們聊「祕密」。"}, {"m": "talk", "t": "你跟 AI 聊天時，有些事可以說，有些是<b>不能隨便說的祕密</b>。"}, {"m": "oops", "t": "因為打進螢幕的字，你不知道會被存到哪、被誰看到。"}, {"m": "happy", "t": "我來教你分清楚——哪些能說、哪些要收好！"}], "rounds": [{"tag": "第 1 關 · 認出祕密", "m": "talk", "say": "先分分看：下面哪一個，是<b>不能隨便跟 AI 或網路上陌生對話說</b>的祕密？", "q": "", "opts": ["我最喜歡的顏色是藍色", "我家住哪、念哪間學校、電話幾號", "我喜歡吃披薩"], "correct": 1, "fb": ["喜歡的顏色說出來沒關係，這不是祕密～", "答對！住址、學校、電話這種能「找到你本人」的資訊，就是要收好的祕密 🔒", "喜歡吃披薩可以聊，這不是祕密啦 😋"], "peek": "能「找到你本人」的資訊——住址、學校、電話、真實全名——都是祕密，不要隨便給 AI 或網路上的陌生人。"}, {"tag": "第 2 關 · 為什麼不能說", "m": "oops", "say": "為什麼這些不能說？<br>因為你打進去的字<b>可能被存起來</b>，而螢幕另一邊，你看不到是誰、也不知道他會怎麼用。", "q": "所以在網路上，最安全的想法是？", "opts": ["反正看不到我，說什麼都沒差", "把「能找到我本人」的資訊收好", "把祕密全告訴 AI，它會保密"], "correct": 1, "fb": ["看不到你，正是危險的地方——你也看不到對方是誰。", "答對！先把能找到你本人的資訊收好，就安全多了 👍", "AI 不是你的祕密好朋友，它是一台機器，資料可能被存下來。"], "peek": "資料可能被存起來、你也看不到對方是誰。把「能找到你本人」的資訊收好最安全。"}, {"tag": "第 3 關 · 有人問你", "m": "oops", "say": "如果 AI，或網路上一個你不認識的對話，問你：<br>「你叫什麼<b>真實全名</b>？住在哪？可以傳<b>照片</b>給我嗎？」", "q": "你應該怎麼做？", "opts": ["乖乖回答，不然沒禮貌", "不要說，然後去告訴爸媽或老師", "傳一張照片就好，其他不說"], "correct": 1, "fb": ["保護自己不是沒禮貌！你有權不回答。", "答對！遇到有人問這些，先不要說，去找<b>你信任的大人</b>（爸媽、老師）講一聲 🙌", "照片也會洩漏很多資訊喔——先別傳，去問信任的大人。"], "peek": "遇到有人問真名、住址、要照片——不要說，並且去告訴你信任的大人（爸媽或老師）。"}, {"tag": "第 4 關 · 聰明保護自己", "m": "happy", "say": "最後一關！你要在網路上取個名字、跟別人互動。哪個做法最安全？", "q": "", "opts": ["用真實全名＋放全家福＋寫學校", "用一個<b>暱稱</b>，不放真實個資和住址", "把家裡地址寫上去，方便別人找我玩"], "correct": 1, "fb": ["真名＋照片＋學校＝把自己的位置公開，很危險。", "答對！用暱稱、不放真實個資，你就能開心玩又保護自己 🛡️", "千萬不要！地址不能隨便公開給網路上的人。"], "peek": "用暱稱、不放真實個資和住址——既能玩，又保護自己。"}], "badge": "🔒", "badgeName": "隱私小衛士", "resultText": "你學會了保護自己的祕密：<br><b>能找到你本人的資訊（真名、住址、學校、電話、照片）不隨便給 AI 或陌生人</b>，遇到有人問就<b>告訴信任的大人</b>。", "parentNote": "這個小遊戲教孩子在使用 AI／上網時的隱私安全：不分享可識別身分的個資、遇到索取個資或照片時求助信任的大人、用暱稱保護自己。可以先瀏覽介紹；開始挑戰時需要登入（免費註冊，帳號用家長的 email，只另記年齡和年級，不收孩子的姓名、照片等資料）。", "moreLine": "更多「小朋友學 AI」小遊戲，陸續登場 ✨", "practice": [{"id":"p01","d":3,"q":"小明跟 AI 聊天時，對方問他：「你念哪一間學校？」他最好怎麼做？","opts":["不要說，並告訴爸媽或老師","說出學校名稱和班級","說出來沒關係，AI 會保密"],"correct":0,"peek":"學校名稱能讓人找到你，不要跟 AI 或網路上的陌生對話說，並告訴信任的大人。"},{"id":"p02","d":1,"q":"下面哪一句，可以放心跟 AI 聊？","opts":["「我最喜歡的動物是海豚」","「我家住在某某路幾號」","「我的電話號碼是幾號」"],"correct":0,"peek":"喜歡的動物不會讓人找到你，可以聊；住址、電話就要收好。"},{"id":"p03","d":1,"q":"下面哪一個，是要收好、不隨便說的祕密？","opts":["我最喜歡看的卡通片","我覺得下雨天很舒服","我的真實全名和班級"],"correct":2,"peek":"真實全名加上班級，就能找到你本人，要收好。"},{"id":"p04","d":2,"q":"小華想在遊戲裡取一個名字。哪一個最安全？","opts":["「陳大明三年二班」","「會飛的閃電小恐龍」","「信義路的小華」"],"correct":1,"peek":"用不會透露真實身分的暱稱最安全；真名、班級、住的路名都不要放。"},{"id":"p05","d":1,"q":"為什麼不要把住址打給 AI 或網路上的陌生對話？","opts":["因為打住址會讓電腦變慢","打進去的字可能被存起來","因為 AI 看不懂住址的字"],"correct":1,"peek":"打進去的字可能被存起來，你也不知道誰會看到，所以能找到你的資訊要收好。"},{"id":"p06","d":3,"q":"網路上一個不認識的人說：「傳一張你穿制服的照片給我看看。」你應該？","opts":["傳一張看不到臉的就好","不要傳，去告訴爸媽或老師","傳了之後馬上刪掉就沒事"],"correct":1,"peek":"制服會透露你念哪間學校。有人要照片就不要傳，並告訴信任的大人。"},{"id":"p07","d":2,"q":"小美想問 AI 一題數學。下面哪個資訊「不需要」打進去？","opts":["她家的住址","題目的內容","她念幾年級"],"correct":0,"peek":"問數學只需要題目和年級；住址跟問題無關，也是要收好的祕密。"},{"id":"p08","d":3,"q":"小明在網路上認識一個「好朋友」，對方要他保密、不要告訴爸媽。小明應該？","opts":["遵守約定，誰都不說","先多聊幾天再決定","馬上告訴爸媽或老師"],"correct":2,"peek":"叫你「不要告訴爸媽」的人，就是要特別小心的人。馬上告訴信任的大人。"},{"id":"p09","d":3,"q":"一個聊天網站說：「告訴我你的生日和全名，我幫你算運勢。」你應該？","opts":["說出來，反正只是算好玩的","只說全名就好，生日不說","不說，先問爸媽這網站能不能用"],"correct":2,"peek":"真實全名是能找到你本人的資訊。遇到要個資的網站，先不要給，問爸媽。"},{"id":"p10","d":1,"q":"哪一個做法，最能保護自己的隱私？","opts":["用暱稱，不放真名和住址","用真名，比較容易交朋友","放全家福，讓大家認識我"],"correct":0,"peek":"用暱稱、不放真實個資，就能開心玩又保護自己。"},{"id":"p11","d":2,"q":"小華覺得：「螢幕另一邊只是機器，說什麼都沒關係。」你覺得呢？","opts":["對，機器不會記得任何事","對，機器看不懂中文字","不對，資料可能被存起來"],"correct":2,"peek":"打進去的字可能被存起來，你也看不到誰會用到。能找到你的資訊要收好。"},{"id":"p12","d":2,"q":"網路上有人一直問你住哪裡，你不想回答。這樣會不會沒禮貌？","opts":["會，別人問了就要回答","會，應該說一半就好","不會，你有權利不回答"],"correct":2,"peek":"保護自己不是沒禮貌！你可以不回答，並告訴信任的大人。"},{"id":"p13","d":2,"q":"下面哪一張照片，最不適合傳到網路上？","opts":["看得到家裡門牌號碼的照片","自己畫的一幅美麗風景畫","一朵花在陽光下的特寫照片"],"correct":0,"peek":"門牌會透露你家在哪裡，這種照片不要傳。"},{"id":"p14","d":3,"q":"小明打電動時，聊天室有人問：「你爸媽幾點下班？家裡只有你嗎？」小明應該？","opts":["不回答，離開並告訴爸媽","老實回答，對方只是好奇","只說幾點下班，其他不說"],"correct":0,"peek":"問你家裡有沒有大人的問題要特別小心。不要回答，離開聊天室，馬上告訴爸媽。"},{"id":"p15","d":2,"q":"小美請 AI 幫忙寫一段自我介紹。她可以提供哪個資訊？","opts":["她家的完整地址","她喜歡畫畫和養貓","爸媽的手機號碼"],"correct":1,"peek":"興趣可以說；地址、電話這種能找到人的資訊要收好。"},{"id":"p16","d":1,"q":"下面哪一個是「能找到你本人」的資訊？","opts":["你最喜歡的水果","你家的電話號碼","你喜歡的顏色"],"correct":1,"peek":"電話號碼能直接找到你，是要收好的祕密。"},{"id":"p17","d":2,"q":"網路上有人讓你覺得怪怪的、不舒服。最好的做法是？","opts":["停下來，告訴信任的大人","自己想辦法，不讓大人知道","繼續聊，看看他想做什麼"],"correct":0,"peek":"覺得怪怪的就停下來，告訴爸媽或老師。這不是告狀，是保護自己。"},{"id":"p18","d":2,"q":"小華在網路上取了暱稱「小華彩虹國小四年三班」。哪裡有問題？","opts":["暱稱裡透露了學校和班級","暱稱太短了，別人會記不住","暱稱裡沒有放上生日"],"correct":0,"peek":"暱稱不要放學校、班級、真名，不然別人就能找到你。"},{"id":"p19","d":3,"q":"小明不小心在網路上說出了學校名稱，他很擔心。最好的做法是？","opts":["告訴爸媽，請大人幫忙處理","不說出來，假裝沒發生過","乾脆把住址也一起說出來"],"correct":0,"peek":"不小心說了也不要怕，馬上告訴爸媽，大人會幫你處理。說出來就對了！"},{"id":"p20","d":1,"q":"下面哪一句是「對」的？","opts":["AI 會幫我保守所有的祕密","跟 AI 說的話一定不會被存","AI 是機器，不是保密的好朋友"],"correct":2,"peek":"AI 不是你的祕密好朋友；打進去的字可能被存起來。"},{"id":"p21","d":2,"q":"網路上的人說：「我也是小學生喔！」你可以確定這是真的嗎？","opts":["不能確定，你看不到對方是誰","可以，他自己都這樣說了啊","可以，他打字的樣子很像小孩"],"correct":0,"peek":"螢幕另一邊你看不到是誰，對方說什麼都不能確定，所以個資要收好。"},{"id":"p22","d":3,"q":"有個網站說：「填寫姓名、學校、電話，就送你遊戲寶物！」你應該？","opts":["趕快填，寶物很稀有","不填，先問爸媽可不可以","只填姓名和學校就好"],"correct":1,"peek":"用禮物換個資的網站要特別小心。不要填，先問爸媽。"},{"id":"p23","d":3,"q":"小華想把寵物的照片傳給網友看，照片背景拍到了窗外的路牌。怎麼做比較好？","opts":["直接傳，大家都愛寵物","把路牌拍清楚一點","先問爸媽，別拍到路牌"],"correct":2,"peek":"照片的背景也會透露你住哪裡。傳照片前先問爸媽，別拍到路牌、門牌。"},{"id":"p24","d":1,"q":"「祕密不能說」主要是指哪一類資訊？","opts":["你喜歡的食物和顏色","能找到你本人的資訊","你今天學到的新知識"],"correct":1,"peek":"真名、住址、學校、電話、照片這些能找到你本人的資訊，就是要收好的祕密。"},{"id":"p25","d":2,"q":"小明跟 AI 說：「我今天考試考得很好，好開心！」這樣可以嗎？","opts":["可以，這不會讓人找到他","不行，什麼都不能跟 AI 說","不行，心情是最大的祕密"],"correct":0,"peek":"心情、興趣這些不會讓人找到你，可以聊；要收好的是真名、住址、學校、電話、照片。"},{"id":"p26","d":3,"q":"網路上的人問：「你家附近有什麼商店？」你應該？","opts":["告訴他，只是聊天而已","不回答，並告訴爸媽","只說商店，不說門牌"],"correct":1,"peek":"附近的商店也能讓人猜出你住哪裡。不回答，並告訴信任的大人。"},{"id":"p27","d":2,"q":"下面哪一個暱稱，最不會洩漏個資？","opts":["「林小華三年二班」","「住大安區的小華」","「愛吃布丁的小熊」"],"correct":2,"peek":"暱稱不要放真名、學校、班級、住的地方。"},{"id":"p28","d":1,"q":"為什麼傳「照片」也要特別小心？","opts":["照片傳出去會讓手機壞掉","照片可能看出你是誰、在哪裡","照片傳出去就會變模糊"],"correct":1,"peek":"照片裡的臉、制服、門牌、路牌，都可能讓人知道你是誰、住哪裡。"},{"id":"p29","d":2,"q":"小明想問 AI：「怎麼照顧生病的狗狗？」他需要先說自己住哪裡嗎？","opts":["需要，AI 才知道怎麼回答","需要，還要說電話號碼","不需要，說狗狗的狀況就好"],"correct":2,"peek":"問問題只要說跟問題有關的事；住址、電話不用說，也不該說。狗狗生病也記得請大人帶去看獸醫。"},{"id":"p30","d":1,"q":"有人跟你要個資時，下面哪一位最適合去告訴？","opts":["網路上剛認識的大哥哥","跟你要個資的那個人","爸媽或學校老師"],"correct":2,"peek":"要找的是你信任、認識的大人，例如爸媽或老師。"},{"id":"p31","d":3,"q":"小美想跟 AI 聊心情：「今天跟好朋友吵架了。」哪個說法最安全？","opts":["說出好朋友的全名和班級","只說心情，不說名字和學校","說出自己和朋友的學校"],"correct":1,"peek":"可以聊心情，但不要說出自己或別人的真名、學校。別人的個資也要保護喔。"},{"id":"p32","d":3,"q":"有人在網路上說：「你不給我住址，我就不跟你當朋友了。」你應該？","opts":["給他，交朋友比較重要","還是不給，並告訴爸媽","給一個大概的地址就好"],"correct":1,"peek":"真正的朋友不會逼你給個資。還是不給，並告訴信任的大人。"}]};
const OPENING = GAME.opening, PN = 10;   /* 練習題：每輪從 GAME.practice（每頁 ≥30 題）隨機抽 PN 題、同一輪不重複，抽到的照 d（1 記憶→2 理解→3 情境）由易到難出，接在 4 關教學後面；「再練 PN 題」只做練習題 */
function draw(a,n){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a.slice(0,n);}
function practiceRounds(){return draw(GAME.practice,PN).sort((a,b)=>a.d-b.d).map(p=>({id:p.id,tag:'練習題',m:'talk',say:p.q,q:'',opts:p.opts,correct:p.correct,peek:p.peek}));}
let ROUNDS = GAME.rounds;
const APP=document.getElementById('app');

// 火柴人 Yoda（原創簡單線條，依心情換姿勢）
function mascot(mood){
 const glow=mood==='happy'?'<ellipse cx="70" cy="96" rx="60" ry="46" fill="#7ee0a8" opacity="0.28"/>':mood==='oops'?'<ellipse cx="70" cy="96" rx="56" ry="44" fill="#ff9a9a" opacity="0.26"/>':'';
 const eyes='<circle cx="63" cy="29" r="2.4" fill="#22314f"/><circle cx="77" cy="29" r="2.4" fill="#22314f"/>';
 const mouth=mood==='happy'?'<path d="M61,36 q9,10 18,0" stroke="#22314f" stroke-width="3" fill="none" stroke-linecap="round"/>':mood==='oops'?'<path d="M63,40 q7,-6 14,0" stroke="#22314f" stroke-width="3" fill="none" stroke-linecap="round"/>':'<path d="M62,37 q8,6 16,0" stroke="#22314f" stroke-width="3" fill="none" stroke-linecap="round"/>';
 let arms,extra='';
 if(mood==='happy') arms='<path d="M70,58 L48,34 M70,58 L92,34" stroke="#22314f" stroke-width="4" fill="none" stroke-linecap="round"/>';
 else if(mood==='oops') arms='<path d="M70,58 L58,40 L64,26 M70,60 L90,72" stroke="#22314f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
 else if(mood==='idea'){arms='<path d="M70,58 L92,40 L95,28 M70,60 L52,76" stroke="#22314f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';extra='<circle cx="95" cy="19" r="7" fill="#ffd76b" stroke="#f4b73f" stroke-width="2.5"/><path d="M95,9 l0,-5 M105,13 l4,-3 M85,13 l-4,-3" stroke="#f4b73f" stroke-width="2" stroke-linecap="round"/>';}
 else arms='<path d="M70,58 L90,42 L95,32 M70,60 L52,78" stroke="#22314f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
 return `<svg width="140" height="150" viewBox="0 0 140 150" class="mascot">${glow}${extra}<circle cx="70" cy="29" r="17" fill="#fff" stroke="#22314f" stroke-width="3.5"/>${eyes}${mouth}<line x1="70" y1="46" x2="70" y2="98" stroke="#22314f" stroke-width="4" stroke-linecap="round"/>${arms}<path d="M70,98 L53,132 M70,98 L87,132" stroke="#22314f" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`;
}
function dots(i){return `<div class="dots">${ROUNDS.map((_,k)=>`<i class="${k<i?'on':''}"></i>`).join('')}</div>`;}
let idx=0,oi=0,score=0;
function start(){oi=0;renderOpening();}
function renderOpening(){const o=OPENING[oi],last=oi>=OPENING.length-1;
 APP.innerHTML=`<div class="center"><div class="brand">小朋友學 AI</div>${mascot(o.m)}<div class="bubble">${o.t}</div><button class="btn" onclick="nextOpening()">${last?'開始挑戰 🚀':'下一句 ›'}</button></div>`;}
function nextOpening(){if(oi>=OPENING.length-1&&window.KidsAuth&&!KidsAuth.requireLogin('quiz'))return;/* 會員閘門：看開場免登入，按「開始挑戰」要登入 */if(oi>=OPENING.length-1&&window.KidsAuth&&KidsAuth.startActivity&&!KidsAuth.startActivity('ai',nextOpening))return;/* 練習額度：登入後再問（後端說今天用完才擋） */oi++;if(oi>=OPENING.length){ROUNDS=GAME.rounds.concat(practiceRounds());idx=0;score=0;showRound();}else renderOpening();}
function showRound(){const r=ROUNDS[idx];
 APP.innerHTML=`${dots(idx)}<div class="center" style="width:100%">${mascot(r.m)}<div class="tag">${r.tag}</div><div class="bubble">${r.say}</div>${r.q?`<div class="q">${r.q}</div>`:''}<div class="opts">${r.opts.map((o,k)=>`<button class="opt" onclick="pick(${k})">${o}</button>`).join('')}</div><button class="peek" onclick="peek()">🙈 偷看答案</button></div>`;}
function pick(k){const r=ROUNDS[idx];const ok=k===r.correct;if(ok)score++;if(window.KidsCoins)KidsCoins.answer(ok,'ai');if(window.KidsDaily)KidsDaily.rec('ai',ok);mkRec(ok);
 APP.innerHTML=`${dots(idx)}<div class="center" style="width:100%">${mascot(ok?'happy':'oops')}<div class="tag">${r.tag}</div><div class="opts">${r.opts.map((o,j)=>`<div class="opt ${j===r.correct?'right':(j===k?'wrong':'dim')}">${j===r.correct?'✓ ':(j===k?'✗ ':'')}${o}</div>`).join('')}</div><div class="fb ${ok?'good':''}">${r.fb?r.fb[k]:(ok?'答對！':'不是這個喔～')+r.peek}</div><button class="btn" onclick="next()">${idx>=ROUNDS.length-1?'看結果 🎉':'下一關 ›'}</button></div>`;}
/* 📕 錯題庫（kids-mistakes.js）：挑戰中答錯的關收進 AI 錯題庫（題目、選項、正解、說明都存純文字）；在錯題庫裡的連對 3 次畢業 */
function mkRec(ok){try{const K=window.KidsMistakes;if(!K)return;const r=ROUNDS[idx],P=K.plain,pg=location.pathname.split('/').pop().replace('.html','');K.record('ai',pg+'|'+(r.id||idx),ok,{pg:pg,tag:P(r.tag),q:P(r.say+(r.q?' '+r.q:'')),opts:r.opts.map(P),c:r.correct,why:P(r.peek||r.fb[r.correct])});}catch(e){}}
function peek(){if(window.KidsCoins)KidsCoins.activity('ai');const r=ROUNDS[idx];
 APP.innerHTML=`${dots(idx)}<div class="center" style="width:100%">${mascot('idea')}<div class="tag">${r.tag}</div><div class="opts">${r.opts.map((o,j)=>`<div class="opt ${j===r.correct?'right':'dim'}">${j===r.correct?'✓ ':''}${o}</div>`).join('')}</div><div class="fb good">💡 ${r.peek}</div><button class="btn" onclick="next()">${idx>=ROUNDS.length-1?'看結果 🎉':'下一關 ›'}</button></div>`;}
function practice(){if(window.KidsAuth&&!KidsAuth.requireLogin('quiz'))return;if(window.KidsAuth&&KidsAuth.startActivity&&!KidsAuth.startActivity('ai',practice))return;ROUNDS=practiceRounds();idx=0;score=0;showRound();}
function next(){idx++;if(idx>=ROUNDS.length)showResult();else showRound();}
function showResult(){
 if(window.KidsDone)KidsDone.record('ai',location.pathname.split('/').pop().replace('.html',''));/* 單元完成：這一頁玩完了（kids_done，會跟著同步） */
 if(window.KidsCoins)KidsCoins.report({type:'ai_page_done',item:'ai:'+location.pathname.split('/').pop().replace('.html',''),correct:score,total:ROUNDS.length});/* 學習幣：玩完就給（不看分數），每頁一次由後端判斷 */
 APP.innerHTML=`<div class="center" style="width:100%"><div class="brand">小朋友學 AI</div>${mascot('happy')}<div class="badge">${GAME.badge}</div><div class="big">${GAME.badgeName}！</div><div class="bubble" style="text-align:center">${GAME.resultText}<br><br>你答對了 ${score} / ${ROUNDS.length} 關 🌟</div><button class="btn" onclick="practice()">再練 ${PN} 題 ✏️</button><button class="btn" onclick="start()">再玩一次 🔁</button><div class="parent">👨‍👩‍👧 <b>給爸媽的話：</b>${GAME.parentNote}</div><div style="font-size:12px;color:#6b84a6;margin-top:1rem">${GAME.moreLine}</div></div>`;}
['nextOpening','showRound','pick','peek','practice','next','showResult','start'].forEach(n=>window[n]=eval(n));
start();
/* 頁首：這一課學完了沒（../completion.js 判定） */
if(window.KidsDone)KidsDone.mount(document.getElementById('kdone'),'ai:'+location.pathname.split('/').pop().replace('.html',''));
</script></body></html>
