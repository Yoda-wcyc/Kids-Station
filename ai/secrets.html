<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>小朋友學 AI · 祕密不能說</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%}
body{font-family:-apple-system,'PingFang TC','Noto Sans TC','Segoe UI',sans-serif;background:linear-gradient(160deg,#8ed7ff 0%,#bfeaff 40%,#fff4d6 100%);min-height:100vh;color:#2a3550}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:1.2rem 1.1rem 2.5rem}
.brand{font-size:12px;letter-spacing:3px;color:#ff8a3c;font-weight:800;margin-bottom:0.2rem}
.dots{display:flex;gap:7px;margin:0.2rem 0 0.9rem}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(42,53,80,0.18)}
.dots i.on{background:#ff9f43}
.mascot{margin:0.1rem 0 0.2rem}
.bubble{background:#fff;border-radius:18px;padding:1rem 1.2rem;box-shadow:0 6px 20px rgba(60,90,140,0.15);font-size:16px;line-height:1.75;position:relative;width:100%;margin-bottom:0.5rem;text-align:left}
.bubble:after{content:'';position:absolute;top:-10px;left:40px;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:10px solid #fff}
.tag{font-size:12px;letter-spacing:2px;color:#ff9f43;font-weight:700;margin-bottom:0.5rem;text-align:center}
.q{font-size:17px;font-weight:700;line-height:1.6;margin:0.3rem 0 0.9rem;text-align:center;color:#22314f}
.opts{display:flex;flex-direction:column;gap:0.6rem;width:100%}
.opt{background:#fff;border:2.5px solid #d6e6f5;border-radius:16px;padding:0.95rem 1.1rem;font-size:15.5px;font-weight:600;color:#2a3550;cursor:pointer;text-align:left;transition:all .15s;box-shadow:0 3px 10px rgba(60,90,140,0.08)}
.opt:hover{border-color:#ff9f43;transform:translateY(-2px)}
.opt.right{border-color:#3ecf8e;background:#e9fbf2}
.opt.wrong{border-color:#ff7676;background:#fff0f0;opacity:.85}
.opt.dim{opacity:.45}
.btn{background:linear-gradient(135deg,#ff9f43,#ff7e5f);color:#fff;border:none;border-radius:40px;padding:0.85rem 2.6rem;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 6px 16px rgba(255,126,80,0.35);margin-top:1rem;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.peek{background:none;border:none;color:#5b7aa8;font-size:13px;text-decoration:underline;cursor:pointer;margin-top:0.9rem}
.fb{background:#fff8ec;border:2px solid #ffe0b3;border-radius:14px;padding:0.9rem 1.1rem;font-size:15px;line-height:1.7;margin-top:0.9rem;width:100%;text-align:left}
.fb.good{background:#e9fbf2;border-color:#a8ecc9}
.parent{background:rgba(255,255,255,0.7);border:1.5px dashed #a9c4e0;border-radius:14px;padding:0.85rem 1rem;font-size:13px;line-height:1.7;color:#42597a;margin-top:1.1rem;width:100%;text-align:left}
.badge{font-size:56px;margin:0.3rem 0}
.big{font-size:23px;font-weight:800;color:#22314f;margin-bottom:0.5rem;text-align:center}
.center{display:flex;flex-direction:column;align-items:center;text-align:center}
</style></head>
<body><div id="app"></div>
<script src="../kids-auth.js"></script>
<script>
const GAME = {"title": "小朋友學 AI · 祕密不能說", "opening": [{"m": "talk", "t": "嗨！我是 <b>Yoda</b> 👋 這一課我們聊「祕密」。"}, {"m": "talk", "t": "你跟 AI 聊天時，有些事可以說，有些是<b>不能隨便說的祕密</b>。"}, {"m": "oops", "t": "因為打進螢幕的字，你不知道會被存到哪、被誰看到。"}, {"m": "happy", "t": "我來教你分清楚——哪些能說、哪些要收好！"}], "rounds": [{"tag": "第 1 關 · 認出祕密", "m": "talk", "say": "先分分看：下面哪一個，是<b>不能隨便跟 AI 或網路上陌生對話說</b>的祕密？", "q": "", "opts": ["我最喜歡的顏色是藍色", "我家住哪、念哪間學校、電話幾號", "我喜歡吃披薩"], "correct": 1, "fb": ["喜歡的顏色說出來沒關係，這不是祕密～", "答對！住址、學校、電話這種能「找到你本人」的資訊，就是要收好的祕密 🔒", "喜歡吃披薩可以聊，這不是祕密啦 😋"], "peek": "能「找到你本人」的資訊——住址、學校、電話、真實全名——都是祕密，不要隨便給 AI 或網路上的陌生人。"}, {"tag": "第 2 關 · 為什麼不能說", "m": "oops", "say": "為什麼這些不能說？<br>因為你打進去的字<b>可能被存起來</b>，而螢幕另一邊，你看不到是誰、也不知道他會怎麼用。", "q": "所以在網路上，最安全的想法是？", "opts": ["反正看不到我，說什麼都沒差", "把「能找到我本人」的資訊收好", "把祕密全告訴 AI，它會保密"], "correct": 1, "fb": ["看不到你，正是危險的地方——你也看不到對方是誰。", "答對！先把能找到你本人的資訊收好，就安全多了 👍", "AI 不是你的祕密好朋友，它是一台機器，資料可能被存下來。"], "peek": "資料可能被存起來、你也看不到對方是誰。把「能找到你本人」的資訊收好最安全。"}, {"tag": "第 3 關 · 有人問你", "m": "oops", "say": "如果 AI，或網路上一個你不認識的對話，問你：<br>「你叫什麼<b>真實全名</b>？住在哪？可以傳<b>照片</b>給我嗎？」", "q": "你應該怎麼做？", "opts": ["乖乖回答，不然沒禮貌", "不要說，然後去告訴爸媽或老師", "傳一張照片就好，其他不說"], "correct": 1, "fb": ["保護自己不是沒禮貌！你有權不回答。", "答對！遇到有人問這些，先不要說，去找<b>你信任的大人</b>（爸媽、老師）講一聲 🙌", "照片也會洩漏很多資訊喔——先別傳，去問信任的大人。"], "peek": "遇到有人問真名、住址、要照片——不要說，並且去告訴你信任的大人（爸媽或老師）。"}, {"tag": "第 4 關 · 聰明保護自己", "m": "happy", "say": "最後一關！你要在網路上取個名字、跟別人互動。哪個做法最安全？", "q": "", "opts": ["用真實全名＋放全家福＋寫學校", "用一個<b>暱稱</b>，不放真實個資和住址", "把家裡地址寫上去，方便別人找我玩"], "correct": 1, "fb": ["真名＋照片＋學校＝把自己的位置公開，很危險。", "答對！用暱稱、不放真實個資，你就能開心玩又保護自己 🛡️", "千萬不要！地址不能隨便公開給網路上的人。"], "peek": "用暱稱、不放真實個資和住址——既能玩，又保護自己。"}], "badge": "🔒", "badgeName": "隱私小衛士", "resultText": "你學會了保護自己的祕密：<br><b>能找到你本人的資訊（真名、住址、學校、電話、照片）不隨便給 AI 或陌生人</b>，遇到有人問就<b>告訴信任的大人</b>。", "parentNote": "這個小遊戲教孩子在使用 AI／上網時的隱私安全：不分享可識別身分的個資、遇到索取個資或照片時求助信任的大人、用暱稱保護自己。可以先瀏覽介紹；開始挑戰時需要登入（免費註冊，帳號用家長的 email，只另記年齡和年級，不收孩子的姓名、照片等資料）。", "moreLine": "更多「小朋友學 AI」小遊戲，陸續登場 ✨"};
const OPENING = GAME.opening, ROUNDS = GAME.rounds;
const APP=document.getElementById('app');

// 火柴人 Yoda（原創簡單線條，依心情換姿勢）
function mascot(mood){
 const glow=mood==='happy'?'<ellipse cx="70" cy="96" rx="60" ry="46" fill="#7ee0a8" opacity="0.28"/>':mood==='oops'?'<ellipse cx="70" cy="96" rx="56" ry="44" fill="#ff9a9a" opacity="0.26"/>':'';
 const eyes='<circle cx="63" cy="29" r="2.4" fill="#22314f"/><circle cx="77" cy="29" r="2.4" fill="#22314f"/>';
 const mouth=mood==='happy'?'<path d="M61,36 q9,10 18,0" stroke="#22314f" stroke-width="3" fill="none" stroke-linecap="round"/>':mood==='oops'?'<path d="M63,40 q7,-6 14,0" stroke="#22314f" stroke-width="3" fill="none" stroke-linecap="round"/>':'<path d="M62,37 q8,6 16,0" stroke="#22314f" stroke-width="3" fill="none" stroke-linecap="round"/>';
 let arms,extra='';
 if(mood==='happy') arms='<path d="M70,58 L48,34 M70,58 L92,34" stroke="#22314f" stroke-width="4" fill="none" stroke-linecap="round"/>';
 else if(mood==='oops') arms='<path d="M70,58 L58,40 L64,26 M70,60 L90,72" stroke="#22314f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
 else if(mood==='idea'){arms='<path d="M70,58 L92,40 L95,28 M70,60 L52,76" stroke="#22314f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';extra='<circle cx="95" cy="19" r="7" fill="#ffd76b" stroke="#f4b73f" stroke-width="2.5"/><path d="M95,9 l0,-5 M105,13 l4,-3 M85,13 l-4,-3" stroke="#f4b73f" stroke-width="2" stroke-linecap="round"/>';}
 else arms='<path d="M70,58 L90,42 L95,32 M70,60 L52,78" stroke="#22314f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
 return `<svg width="140" height="150" viewBox="0 0 140 150" class="mascot">${glow}${extra}<circle cx="70" cy="29" r="17" fill="#fff" stroke="#22314f" stroke-width="3.5"/>${eyes}${mouth}<line x1="70" y1="46" x2="70" y2="98" stroke="#22314f" stroke-width="4" stroke-linecap="round"/>${arms}<path d="M70,98 L53,132 M70,98 L87,132" stroke="#22314f" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`;
}
function dots(i){return `<div class="dots">${ROUNDS.map((_,k)=>`<i class="${k<i?'on':''}"></i>`).join('')}</div>`;}
let idx=0,oi=0,score=0;
function start(){oi=0;renderOpening();}
function renderOpening(){const o=OPENING[oi],last=oi>=OPENING.length-1;
 APP.innerHTML=`<div class="center"><div class="brand">小朋友學 AI</div>${mascot(o.m)}<div class="bubble">${o.t}</div><button class="btn" onclick="nextOpening()">${last?'開始挑戰 🚀':'下一句 ›'}</button></div>`;}
function nextOpening(){if(oi>=OPENING.length-1&&window.KidsAuth&&!KidsAuth.requireLogin('quiz'))return;/* 會員閘門：看開場免登入，按「開始挑戰」要登入 */oi++;if(oi>=OPENING.length){idx=0;showRound();}else renderOpening();}
function showRound(){const r=ROUNDS[idx];
 APP.innerHTML=`${dots(idx)}<div class="center" style="width:100%">${mascot(r.m)}<div class="tag">${r.tag}</div><div class="bubble">${r.say}</div>${r.q?`<div class="q">${r.q}</div>`:''}<div class="opts">${r.opts.map((o,k)=>`<button class="opt" onclick="pick(${k})">${o}</button>`).join('')}</div><button class="peek" onclick="peek()">🙈 偷看答案</button></div>`;}
function pick(k){const r=ROUNDS[idx];const ok=k===r.correct;if(ok)score++;
 APP.innerHTML=`${dots(idx)}<div class="center" style="width:100%">${mascot(ok?'happy':'oops')}<div class="tag">${r.tag}</div><div class="opts">${r.opts.map((o,j)=>`<div class="opt ${j===r.correct?'right':(j===k?'wrong':'dim')}">${j===r.correct?'✓ ':(j===k?'✗ ':'')}${o}</div>`).join('')}</div><div class="fb ${ok?'good':''}">${r.fb[k]}</div><button class="btn" onclick="next()">${idx>=ROUNDS.length-1?'看結果 🎉':'下一關 ›'}</button></div>`;}
function peek(){const r=ROUNDS[idx];
 APP.innerHTML=`${dots(idx)}<div class="center" style="width:100%">${mascot('idea')}<div class="tag">${r.tag}</div><div class="opts">${r.opts.map((o,j)=>`<div class="opt ${j===r.correct?'right':'dim'}">${j===r.correct?'✓ ':''}${o}</div>`).join('')}</div><div class="fb good">💡 ${r.peek}</div><button class="btn" onclick="next()">${idx>=ROUNDS.length-1?'看結果 🎉':'下一關 ›'}</button></div>`;}
function next(){idx++;if(idx>=ROUNDS.length)showResult();else showRound();}
function showResult(){
 APP.innerHTML=`<div class="center" style="width:100%"><div class="brand">小朋友學 AI</div>${mascot('happy')}<div class="badge">${GAME.badge}</div><div class="big">${GAME.badgeName}！</div><div class="bubble" style="text-align:center">${GAME.resultText}<br><br>你答對了 ${score} / ${ROUNDS.length} 關 🌟</div><button class="btn" onclick="start()">再玩一次 🔁</button><div class="parent">👨‍👩‍👧 <b>給爸媽的話：</b>${GAME.parentNote}</div><div style="font-size:12px;color:#6b84a6;margin-top:1rem">${GAME.moreLine}</div></div>`;}
['nextOpening','showRound','pick','peek','next','showResult','start'].forEach(n=>window[n]=eval(n));
start();
</script></body></html>
