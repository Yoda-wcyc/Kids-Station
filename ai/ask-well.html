<title>小朋友學 AI · 怎麼問得好</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%}
body{font-family:-apple-system,'PingFang TC','Noto Sans TC','Segoe UI',sans-serif;background:linear-gradient(160deg,#8ed7ff 0%,#bfeaff 40%,#fff4d6 100%);min-height:100vh;color:#2a3550}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:1.2rem 1.1rem 2.5rem}
.brand{font-size:12px;letter-spacing:3px;color:#ff8a3c;font-weight:800;margin-bottom:0.2rem}
.dots{display:flex;gap:7px;margin:0.2rem 0 0.9rem}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(42,53,80,0.18)}
.dots i.on{background:#ff9f43}
.mascot{margin:0.1rem 0 0.2rem}
.bubble{background:#fff;border-radius:18px;padding:1rem 1.2rem;box-shadow:0 6px 20px rgba(60,90,140,0.15);font-size:16px;line-height:1.75;position:relative;width:100%;margin-bottom:0.5rem;text-align:left}
.bubble:after{content:'';position:absolute;top:-10px;left:40px;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:10px solid #fff}
.tag{font-size:12px;letter-spacing:2px;color:#ff9f43;font-weight:700;margin-bottom:0.5rem;text-align:center}
.q{font-size:17px;font-weight:700;line-height:1.6;margin:0.3rem 0 0.9rem;text-align:center;color:#22314f}
.opts{display:flex;flex-direction:column;gap:0.6rem;width:100%}
.opt{background:#fff;border:2.5px solid #d6e6f5;border-radius:16px;padding:0.95rem 1.1rem;font-size:15.5px;font-weight:600;color:#2a3550;cursor:pointer;text-align:left;transition:all .15s;box-shadow:0 3px 10px rgba(60,90,140,0.08)}
.opt:hover{border-color:#ff9f43;transform:translateY(-2px)}
.opt.right{border-color:#3ecf8e;background:#e9fbf2}
.opt.wrong{border-color:#ff7676;background:#fff0f0;opacity:.85}
.opt.dim{opacity:.45}
.btn{background:linear-gradient(135deg,#ff9f43,#ff7e5f);color:#fff;border:none;border-radius:40px;padding:0.85rem 2.6rem;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 6px 16px rgba(255,126,80,0.35);margin-top:1rem;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.peek{background:none;border:none;color:#5b7aa8;font-size:13px;text-decoration:underline;cursor:pointer;margin-top:0.9rem}
.fb{background:#fff8ec;border:2px solid #ffe0b3;border-radius:14px;padding:0.9rem 1.1rem;font-size:15px;line-height:1.7;margin-top:0.9rem;width:100%;text-align:left}
.fb.good{background:#e9fbf2;border-color:#a8ecc9}
.parent{background:rgba(255,255,255,0.7);border:1.5px dashed #a9c4e0;border-radius:14px;padding:0.85rem 1rem;font-size:13px;line-height:1.7;color:#42597a;margin-top:1.1rem;width:100%;text-align:left}
.badge{font-size:56px;margin:0.3rem 0}
.big{font-size:23px;font-weight:800;color:#22314f;margin-bottom:0.5rem;text-align:center}
.center{display:flex;flex-direction:column;align-items:center;text-align:center}
</style></head>

<script>
const GAME = {"title": "小朋友學 AI · 怎麼問得好", "opening": [{"m": "talk", "t": "嗨！我是 <b>Yoda</b> 👋 這一課教你一個超實用的本領——"}, {"m": "talk", "t": "<b>怎麼「問」AI，它才幫得上你</b>。"}, {"m": "idea", "t": "同樣一件事，問得爛 AI 就亂回答；問得好，它超好用。"}, {"m": "happy", "t": "記住三招，你就是提問高手！"}], "rounds": [{"tag": "第 1 招 · 講清楚", "m": "talk", "say": "第一招：<b>講清楚你要什麼</b>。<br>比比看，哪個問法比較好？", "q": "", "opts": ["「講個故事。」", "「講一個 3 句話的故事，主角是一隻怕黑的小恐龍，結局要開心。」", "「隨便啦。」"], "correct": 1, "fb": ["太籠統了，AI 只能亂猜，給的東西你不一定喜歡。", "答對！講清楚長度、主角、結局——AI 就給得剛剛好 🎯", "「隨便」AI 最難幫你，它又不會讀心。"], "peek": "講清楚你要什麼（長度、主題、風格、結局），AI 才給得到位。"}, {"tag": "第 2 招 · 給背景", "m": "talk", "say": "第二招：<b>給一點背景</b>。<br>你想請 AI 解釋一題數學，怎麼問比較好？", "q": "", "opts": ["「這題怎麼算？」", "「我是小五、還沒學過分數，請用簡單的方式解釋這題。」", "「快點給我答案。」"], "correct": 1, "fb": ["它不知道你的程度，可能講得太難或太簡單。", "答對！告訴 AI 你的年級、已經懂什麼，它就講得剛好懂 👍", "只要答案＝你沒學到，而且答案可能是唬爛的（要查證！）。"], "peek": "給背景——你的年級、已經懂什麼、要做什麼——AI 才會用適合你的方式回答。"}, {"tag": "第 3 招 · 說形式", "m": "idea", "say": "第三招：<b>說你要什麼形式</b>。<br>你想要一份「重點整理」，哪個問法最好？", "q": "", "opts": ["「跟我說說看。」", "「請用<b>條列 3 點</b>、每點一句話，幫我整理重點。」", "「越多越好。」"], "correct": 1, "fb": ["沒說形式，AI 可能給你一大段，難整理。", "答對！說清楚要「條列 3 點、每點一句」，AI 就照做 📋", "越多越難讀——說清楚形式和數量比較實用。"], "peek": "說清楚形式（條列還是一段、要幾點、多長），AI 的答案才好用。"}, {"tag": "第 4 招 · 別忘了查證", "m": "happy", "say": "最後一招，也最重要：<br>就算問得很好，AI 還是<b>可能唬爛</b>（記得上一課嗎？）。", "q": "拿到 AI 的答案後，聰明的你會？", "opts": ["直接用，反正我問得很好", "重要的地方<b>查證一下</b>、或問大人", "再也不相信 AI"], "correct": 1, "fb": ["問得好 ≠ 答得對，重要的還是要查一下。", "答對！問得好＋會查證＝你就是真正的 AI 高手 🌟", "也不用完全不信～它很好用，只是重要的事要查證。"], "peek": "問得好也要查證：AI 可能出錯，重要的答案要自己查一下或問大人。"}], "badge": "🎯", "badgeName": "提問高手", "resultText": "你學會了問 AI 的三招：<br><b>講清楚 → 給背景 → 說形式</b>，還記得<b>拿到答案要查證</b>。這樣 AI 就是你最強的幫手！", "parentNote": "這個小遊戲教孩子有效使用 AI 的提問素養：把需求講清楚、提供背景、指定形式，並在拿到結果後查證。全程無投資內容；可以先瀏覽介紹，開始挑戰時需要登入（免費註冊，帳號用家長的 email，只另記年齡和年級，不收孩子的姓名、照片等資料）。", "moreLine": "更多「小朋友學 AI」小遊戲，陸續登場 ✨", "practice": [{"id":"p01","d":2,"q":"小明想請 AI 推薦一本書。哪個問法最好？","opts":["「隨便推薦一本你自己覺得好看的書吧」","「推薦一本給小五讀、講動物的故事書」","「推薦一本書，越厚越難越好」"],"correct":1,"peek":"講清楚你的年級和想看的主題，AI 才推薦得剛剛好。"},{"id":"p02","d":2,"q":"小華想請 AI 出幾題乘法練習。哪個問法最清楚？","opts":["「出 5 題兩位數乘一位數的題目」","「出一些數學題給我，什麼題目都可以」","「出很多很多題目，越多越好」"],"correct":0,"peek":"講清楚要幾題、什麼範圍，AI 才出得剛好。"},{"id":"p03","d":2,"q":"小美請 AI 解釋「光合作用」。她可以先補充哪一句，讓解釋更好懂？","opts":["「請用大學教授上課的方式來說明」","「我是五年級，請用簡單的話說」","「解釋得越長越難越好喔」"],"correct":1,"peek":"告訴 AI 你的年級，它就會用你聽得懂的方式說明。"},{"id":"p04","d":2,"q":"小明想要一份「颱風重點整理」，方便自己複習。哪個問法最好？","opts":["「把你知道的颱風知識，全部都講給我」","「用條列 3 點、每點一句話整理」","「說說颱風，長短都可以」"],"correct":1,"peek":"說清楚形式（條列、幾點、每點多長），答案才好用。"},{"id":"p05","d":1,"q":"「講清楚你要什麼」，指的是下面哪一個？","opts":["說清楚主題、長度和想要的結果","只打一個字，讓 AI 自己猜","打越多驚嘆號，AI 越懂"],"correct":0,"peek":"講清楚＝主題、長度、想要什麼結果都說出來。"},{"id":"p06","d":3,"q":"小華問 AI：「這題怎麼算？」AI 講得很難，他聽不懂。下一步最好是？","opts":["放棄，反正 AI 本來就聽不懂人話","換一題問，這題跳過不管","補一句「我是小五，請講簡單一點」"],"correct":2,"peek":"補上背景（你的年級、哪裡不懂），AI 就能換個方式講。"},{"id":"p07","d":2,"q":"小美想請 AI 幫她想班級海報的標語。哪個問法最好？","opts":["「幫我想一些標語，什麼主題都可以，越多越好」","「愛護地球標語 3 句，每句 10 字內」","「幫我想很多很多很長的標語」"],"correct":1,"peek":"主題、數量、長度都講清楚，AI 給的就是你要的。"},{"id":"p08","d":1,"q":"下面哪一句是在「給背景」？","opts":["「請你快一點回答，我很急」","「我是小五，下週要上台報告兩分鐘」","「你一定要回答得非常完美、非常厲害」"],"correct":1,"peek":"給背景＝告訴 AI 你是誰、要做什麼、已經會什麼。"},{"id":"p09","d":1,"q":"下面哪一句是在「說形式」？","opts":["「請你認真一點、仔細一點回答我」","「我覺得這個問題很有趣」","「請整理成表格，分成兩欄」"],"correct":2,"peek":"說形式＝告訴 AI 答案要長什麼樣子：表格、條列、幾點、多長。"},{"id":"p10","d":3,"q":"小明請 AI 寫一首詩，結果太長了。下一次他可以怎麼問？","opts":["「再幫我寫一首詩，這次要寫得更好一點」","「寫一首 4 行的短詩，主題是秋天」","「寫一首詩，長度你自己決定」"],"correct":1,"peek":"說清楚長度和主題（4 行、秋天），AI 就不會寫太長。"},{"id":"p11","d":2,"q":"小華問得很清楚，AI 也回答得很詳細。接下來他應該？","opts":["直接用，問得好就一定對","把答案整段背起來就好","重要的地方再查證一下"],"correct":2,"peek":"問得好 ≠ 答得對。重要的地方還是要查證，或問大人。"},{"id":"p12","d":1,"q":"為什麼「隨便啦」是很難幫忙的問法？","opts":["AI 不會讀心，不知道你要什麼","因為 AI 不喜歡聽到「啦」字","因為 AI 只回答很長的問題"],"correct":0,"peek":"AI 不會讀心。你不說清楚，它只能亂猜。"},{"id":"p13","d":2,"q":"小美想請 AI 解釋一個她已經懂一半的觀念。怎麼問最好？","opts":["假裝完全不懂，請它從頭講","先說自己懂哪裡、卡在哪裡","不說自己的程度，讓它猜"],"correct":1,"peek":"告訴 AI 你已經懂什麼、卡在哪裡，它就能直接幫你解決卡住的地方。"},{"id":"p14","d":2,"q":"小明想學英文單字，請 AI 幫忙。哪個問法最好？","opts":["「給我 5 個水果的英文和中文」","「把英文全部都教給我，從頭教到尾吧」","「給我一些很難很難的單字」"],"correct":0,"peek":"講清楚數量和主題（5 個、水果），AI 給的才剛好能學。"},{"id":"p15","d":2,"q":"小華想請 AI 推薦下雨天在家可以玩的遊戲。哪個問法最好？","opts":["「推薦 3 個下雨天在家玩的遊戲」","「推薦好玩的東西給我，什麼都可以」","「幫我想很多很多，越多越好」"],"correct":0,"peek":"說清楚數量（3 個）和情況（下雨天、在家），AI 才推薦得到位。"},{"id":"p16","d":3,"q":"小美問完問題，AI 回了一大段，不是她要的樣子。她可以？","opts":["再補一句「請改成條列 3 點」","生氣地關掉，以後再也不用 AI","自己把一大段全部背下來"],"correct":0,"peek":"不滿意可以補充要求，例如「改成條列 3 點」，AI 會照著改。"},{"id":"p17","d":2,"q":"下面哪一個問題，AI 最容易答得「剛剛好」？","opts":["「告訴我貓頭鷹的事，你想說什麼都好」","「貓頭鷹的事，你知道的全說」","「用 3 句話介紹貓頭鷹給小五聽」"],"correct":2,"peek":"講清楚長度（3 句）和對象（小五），AI 就講得剛剛好。"},{"id":"p18","d":3,"q":"小明請 AI 出「10 題分數小考」，AI 只給了 6 題。他應該？","opts":["AI 給幾題就是幾題，照用","數一數，請它補到 10 題","不檢查，直接拿給老師看"],"correct":1,"peek":"AI 不一定完全照你的要求做。拿到答案要檢查，不對就請它修正。"},{"id":"p19","d":1,"q":"「給背景」為什麼有幫助？","opts":["AI 從此就永遠不會出錯","AI 能用適合你的方式回答","AI 會把答案寫得越長越好"],"correct":1,"peek":"給背景讓 AI 知道你的程度和目的，才會用適合你的方式回答；但它還是可能出錯，要查證。"},{"id":"p20","d":3,"q":"小華要做自然報告，想請 AI 幫忙整理。哪個問法最好？","opts":["「我小五要報告海龜，條列 5 個重點」","「我要報告海龜，請你把報告全部幫我做好」","「把海龜的所有知識都告訴我」"],"correct":0,"peek":"這個問法三招都用了：給背景（小五、報告）、講清楚（海龜）、說形式（條列 5 點）。"},{"id":"p21","d":3,"q":"小美想請 AI 把她寫的一段話改得更通順。哪個問法最好？","opts":["「隨便改，你想怎麼改就怎麼改都可以」","「全部重寫，寫得越長越好」","「幫我改通順，但不要改掉我的意思」"],"correct":2,"peek":"講清楚你要的結果（改通順、不改意思），AI 才不會改過頭。"},{"id":"p22","d":2,"q":"你問 AI 一個問題，它回答的內容跟你想問的不一樣。照這一課，你可以先檢查什麼？","opts":["AI 今天心情好不好","我的問題有沒有講清楚","我打字的速度快不快"],"correct":1,"peek":"AI 不會讀心。答非所問時，先檢查自己有沒有講清楚要什麼，再補充說明。"},{"id":"p23","d":3,"q":"小明想請 AI 用簡單的話解釋「地震」，講給小一的弟弟聽。怎麼問最好？","opts":["「用小一聽得懂的話，3 句解釋地震」","「解釋地震給我聽，要用很專業的說法喔」","「說說地震的事，多長都可以」"],"correct":0,"peek":"說清楚對象（小一）和長度（3 句），AI 才會講得剛好。"},{"id":"p24","d":2,"q":"下面哪一個問法，三招（講清楚、給背景、說形式）都用到了？","opts":["「介紹台灣黑熊，越詳細越好，越多越好喔」","「我小五，跟我聊聊動物吧」","「我小五，請條列 3 點介紹台灣黑熊」"],"correct":2,"peek":"「我小五」是背景、「台灣黑熊」是講清楚、「條列 3 點」是形式，三招都有。"},{"id":"p25","d":3,"q":"小華想請 AI 幫忙寫感謝卡給老師。哪個問法最好？","opts":["「寫 3 句感謝卡，謝謝老師教我游泳」","「寫一張感謝卡給老師，內容你幫我決定吧」","「寫很長很長的卡片給老師」"],"correct":0,"peek":"講清楚長度和要感謝的事，卡片才有你的心意；最後最好再用自己的話改一改。"},{"id":"p26","d":2,"q":"小美想請 AI 幫她想跳繩比賽的加油口號。哪一句補充最有用？","opts":["「你要很認真、很用心地幫我想喔」","「要短短一句、喊起來有力」","「這對我來說很重要」"],"correct":1,"peek":"說清楚形式和效果（短短一句、喊起來有力），比只說「認真想」更有用。"},{"id":"p27","d":2,"q":"小明只打了兩個字：「恐龍。」AI 回了一大堆。這個問法少了什麼？","opts":["少了後面加一個驚嘆號","少了最後的「謝謝」兩字","少了他到底想知道什麼"],"correct":2,"peek":"只打「恐龍」，AI 不知道你要問什麼。要講清楚想知道哪一件事，例如恐龍為什麼滅絕。"},{"id":"p28","d":2,"q":"小華想請 AI 幫忙複習「植物的構造」。哪個問法最好？","opts":["「植物的構造是什麼？全部都說給我聽」","「考考我，要考幾題你決定」","「出 5 題選擇題考我，最後給答案」"],"correct":2,"peek":"說清楚數量、題型和順序（5 題選擇題、最後給答案），複習起來最好用。"},{"id":"p29","d":3,"q":"小美用很好的問法問 AI，拿到一個數學答案。她最好怎麼做？","opts":["問法很好，所以答案一定沒錯","再問一個更長的問題就好","自己再算一次，確認答案對"],"correct":2,"peek":"問得好也要查證。數學答案可以自己再算一次確認。"},{"id":"p30","d":2,"q":"小明想用英文寫一句「生日快樂」的祝福給英文老師。哪個問法最好？","opts":["「寫一句簡單的英文生日祝福」","「寫一些英文，內容你決定」","「寫一篇又長又難的英文文章」"],"correct":0,"peek":"講清楚要「一句」「簡單」「生日祝福」，AI 才給得剛好。"},{"id":"p31","d":1,"q":"小華問 AI 時先說：「我已經會加減法，還不會乘法。」這是在用哪一招？","opts":["給背景：讓 AI 知道我的程度","說形式：讓 AI 知道答案的樣子","查證：確認 AI 的答案對不對"],"correct":0,"peek":"說出自己已經會什麼、還不會什麼，就是「給背景」。"},{"id":"p32","d":1,"q":"小美說：「請用表格整理，分成優點和缺點兩欄。」這是在用哪一招？","opts":["給背景：說出自己的年級程度","查證：檢查答案對不對","說形式：說清楚答案的樣子"],"correct":2,"peek":"指定表格、兩欄，就是「說形式」。"}]};
const OPENING = GAME.opening, PN = 10;   /* 練習題：每輪從 GAME.practice（每頁 ≥30 題）隨機抽 PN 題、同一輪不重複，抽到的照 d（1 記憶→2 理解→3 情境）由易到難出，接在 4 關教學後面；「再練 PN 題」只做練習題 */
function draw(a,n){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a.slice(0,n);}
function practiceRounds(){return draw(GAME.practice,PN).sort((a,b)=>a.d-b.d).map(p=>({id:p.id,tag:'練習題',m:'talk',say:p.q,q:'',opts:p.opts,correct:p.correct,peek:p.peek}));}
let ROUNDS = GAME.rounds;
const APP=document.getElementById('app');

// 火柴人 Yoda（原創簡單線條，依心情換姿勢）
function mascot(mood){
 const glow=mood==='happy'?'<ellipse cx="70" cy="96" rx="60" ry="46" fill="#7ee0a8" opacity="0.28"/>':mood==='oops'?'<ellipse cx="70" cy="96" rx="56" ry="44" fill="#ff9a9a" opacity="0.26"/>':'';
 const eyes='<circle cx="63" cy="29" r="2.4" fill="#22314f"/><circle cx="77" cy="29" r="2.4" fill="#22314f"/>';
 const mouth=mood==='happy'?'<path d="M61,36 q9,10 18,0" stroke="#22314f" stroke-width="3" fill="none" stroke-linecap="round"/>':mood==='oops'?'<path d="M63,40 q7,-6 14,0" stroke="#22314f" stroke-width="3" fill="none" stroke-linecap="round"/>':'<path d="M62,37 q8,6 16,0" stroke="#22314f" stroke-width="3" fill="none" stroke-linecap="round"/>';
 let arms,extra='';
 if(mood==='happy') arms='<path d="M70,58 L48,34 M70,58 L92,34" stroke="#22314f" stroke-width="4" fill="none" stroke-linecap="round"/>';
 else if(mood==='oops') arms='<path d="M70,58 L58,40 L64,26 M70,60 L90,72" stroke="#22314f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
 else if(mood==='idea'){arms='<path d="M70,58 L92,40 L95,28 M70,60 L52,76" stroke="#22314f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';extra='<circle cx="95" cy="19" r="7" fill="#ffd76b" stroke="#f4b73f" stroke-width="2.5"/><path d="M95,9 l0,-5 M105,13 l4,-3 M85,13 l-4,-3" stroke="#f4b73f" stroke-width="2" stroke-linecap="round"/>';}
 else arms='<path d="M70,58 L90,42 L95,32 M70,60 L52,78" stroke="#22314f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
 return `<svg width="140" height="150" viewBox="0 0 140 150" class="mascot">${glow}${extra}<circle cx="70" cy="29" r="17" fill="#fff" stroke="#22314f" stroke-width="3.5"/>${eyes}${mouth}<line x1="70" y1="46" x2="70" y2="98" stroke="#22314f" stroke-width="4" stroke-linecap="round"/>${arms}<path d="M70,98 L53,132 M70,98 L87,132" stroke="#22314f" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`;
}
function dots(i){return `<div class="dots">${ROUNDS.map((_,k)=>`<i class="${k<i?'on':''}"></i>`).join('')}</div>`;}
let idx=0,oi=0,score=0;
function start(){oi=0;renderOpening();}
function renderOpening(){const o=OPENING[oi],last=oi>=OPENING.length-1;
 APP.innerHTML=`<div class="center"><div class="brand">小朋友學 AI</div>${mascot(o.m)}<div class="bubble">${o.t}</div><button class="btn" onclick="nextOpening()">${last?'開始挑戰 🚀':'下一句 ›'}</button></div>`;}
function nextOpening(){if(oi>=OPENING.length-1&&window.KidsAuth&&!KidsAuth.requireLogin('quiz'))return;/* 會員閘門：看開場免登入，按「開始挑戰」要登入 */if(oi>=OPENING.length-1&&window.KidsAuth&&KidsAuth.startActivity&&!KidsAuth.startActivity('ai',nextOpening))return;/* 練習額度：登入後再問（後端說今天用完才擋） */oi++;if(oi>=OPENING.length){ROUNDS=GAME.rounds.concat(practiceRounds());idx=0;score=0;showRound();}else renderOpening();}
function showRound(){const r=ROUNDS[idx];
 APP.innerHTML=`${dots(idx)}<div class="center" style="width:100%">${mascot(r.m)}<div class="tag">${r.tag}</div><div class="bubble">${r.say}</div>${r.q?`<div class="q">${r.q}</div>`:''}<div class="opts">${r.opts.map((o,k)=>`<button class="opt" onclick="pick(${k})">${o}</button>`).join('')}</div><button class="peek" onclick="peek()">🙈 偷看答案</button></div>`;}
function pick(k){const r=ROUNDS[idx];const ok=k===r.correct;if(ok)score++;if(window.KidsCoins)KidsCoins.answer(ok,'ai');if(window.KidsDaily)KidsDaily.rec('ai',ok);mkRec(ok);
 APP.innerHTML=`${dots(idx)}<div class="center" style="width:100%">${mascot(ok?'happy':'oops')}<div class="tag">${r.tag}</div><div class="opts">${r.opts.map((o,j)=>`<div class="opt ${j===r.correct?'right':(j===k?'wrong':'dim')}">${j===r.correct?'✓ ':(j===k?'✗ ':'')}${o}</div>`).join('')}</div><div class="fb ${ok?'good':''}">${r.fb?r.fb[k]:(ok?'答對！':'不是這個喔～')+r.peek}</div><button class="btn" onclick="next()">${idx>=ROUNDS.length-1?'看結果 🎉':'下一關 ›'}</button></div>`;}
/* 📕 錯題庫（kids-mistakes.js）：挑戰中答錯的關收進 AI 錯題庫（題目、選項、正解、說明都存純文字）；在錯題庫裡的連對 3 次畢業 */
function mkRec(ok){try{const K=window.KidsMistakes;if(!K)return;const r=ROUNDS[idx],P=K.plain,pg=location.pathname.split('/').pop().replace('.html','');K.record('ai',pg+'|'+(r.id||idx),ok,{pg:pg,tag:P(r.tag),q:P(r.say+(r.q?' '+r.q:'')),opts:r.opts.map(P),c:r.correct,why:P(r.peek||r.fb[r.correct])});}catch(e){}}
function peek(){if(window.KidsCoins)KidsCoins.activity('ai');const r=ROUNDS[idx];
 APP.innerHTML=`${dots(idx)}<div class="center" style="width:100%">${mascot('idea')}<div class="tag">${r.tag}</div><div class="opts">${r.opts.map((o,j)=>`<div class="opt ${j===r.correct?'right':'dim'}">${j===r.correct?'✓ ':''}${o}</div>`).join('')}</div><div class="fb good">💡 ${r.peek}</div><button class="btn" onclick="next()">${idx>=ROUNDS.length-1?'看結果 🎉':'下一關 ›'}</button></div>`;}
function practice(){if(window.KidsAuth&&!KidsAuth.requireLogin('quiz'))return;if(window.KidsAuth&&KidsAuth.startActivity&&!KidsAuth.startActivity('ai',practice))return;ROUNDS=practiceRounds();idx=0;score=0;showRound();}
function next(){idx++;if(idx>=ROUNDS.length)showResult();else showRound();}
function showResult(){
 if(window.KidsDone)KidsDone.record('ai',location.pathname.split('/').pop().replace('.html',''));/* 單元完成：這一頁玩完了（kids_done，會跟著同步） */
 if(window.KidsCoins)KidsCoins.report({type:'ai_page_done',item:'ai:'+location.pathname.split('/').pop().replace('.html',''),correct:score,total:ROUNDS.length});/* 學習幣：玩完就給（不看分數），每頁一次由後端判斷 */
 APP.innerHTML=`<div class="center" style="width:100%"><div class="brand">小朋友學 AI</div>${mascot('happy')}<div class="badge">${GAME.badge}</div><div class="big">${GAME.badgeName}！</div><div class="bubble" style="text-align:center">${GAME.resultText}<br><br>你答對了 ${score} / ${ROUNDS.length} 關 🌟</div><button class="btn" onclick="practice()">再練 ${PN} 題 ✏️</button><button class="btn" onclick="start()">再玩一次 🔁</button><div class="parent">👨‍👩‍👧 <b>給爸媽的話：</b>${GAME.parentNote}</div><div style="font-size:12px;color:#6b84a6;margin-top:1rem">${GAME.moreLine}</div></div>`;}
['nextOpening','showRound','pick','peek','practice','next','showResult','start'].forEach(n=>window[n]=eval(n));
start();
/* 頁首：這一課學完了沒（../completion.js 判定） */
if(window.KidsDone)KidsDone.mount(document.getElementById('kdone'),'ai:'+location.pathname.split('/').pop().replace('.html',''));
</script></body></html>
