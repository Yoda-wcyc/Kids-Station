/* 免登入只顯示「去登入」；登入後 sync.js 跟帳號同步，合併到新資料（kids-sync-updated）或別的分頁改了紀錄（kids-done-changed）就重畫。 */
(function () {
  'use strict';
  var el = document.getElementById('kas-page'), t = null;
  function render() { try { window.KidsAssistantUI.page(el); } catch (e) { el.innerHTML = '<p class="center muted">小助理暫時打不開，回學習站繼續練習吧！</p>'; } }
  function soon() { clearTimeout(t); t = setTimeout(render, 200); }
  window.addEventListener('kids-done-changed', soon);
  window.addEventListener('kids-sync-updated', soon);
  window.addEventListener('pageshow', function (e) { if (e.persisted) render(); });
  render();
})();
</script>
