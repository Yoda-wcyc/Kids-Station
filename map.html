<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff8ec">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no">
<title>課程地圖 · 小朋友學習站</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%BA%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=d8aed364d6">
<style>
/* 課程地圖（2026-10-20）：每科每單元一格；狀態＝顏色＋符號＋文字（色弱也分得出來），還沒開始的格子是虛線框 */
.mbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:3px solid var(--line);box-shadow:0 2px 10px rgba(38,52,69,.06)}
.mbar-in{max-width:1000px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mbar-in .brand{flex:1;min-width:0;font-size:1.1rem;font-weight:800;color:var(--ink);text-decoration:none;white-space:nowrap}
.mwrap{max-width:1000px;margin:0 auto;padding:14px 16px calc(40px + env(safe-area-inset-bottom))}
.hero{text-align:center;margin:4px 0 12px}.hero h1{font-size:1.6rem}
.sum{display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px}
.sum-big{font-size:1.25rem;font-weight:800}.sum-big b{font-size:2.2rem;font-variant-numeric:tabular-nums}
.pbar{display:block;height:18px;border-radius:999px;background:#f3e6cf;overflow:hidden;border:2px solid var(--line)}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#69db7c,#2f9e44);border-radius:999px}
.sum .pbar{flex:1 1 260px}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0;padding:0;list-style:none}
.legend li{border-radius:999px;padding:4px 12px;font-size:.9rem;font-weight:700;border:2px solid}
.who{margin:12px 0 0;font-size:.95rem}
.subj h2{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:1.3rem}
.subj h2 .cnt{font-size:.95rem;font-weight:800;border-radius:999px;padding:2px 12px;background:#fff8ec;border:2px solid var(--line)}
.subj h2 .cnt.all{background:var(--ok-bg);border-color:#9fe0bd;color:#145c38}
.book{font-size:1.05rem;margin:14px 0 8px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.mu{display:flex;flex-direction:column;gap:6px;min-height:120px;padding:12px 14px;border-radius:18px;border:3px solid;text-decoration:none;color:var(--ink);box-shadow:0 3px 0 rgba(38,52,69,.08);touch-action:manipulation}
.mu:active{transform:translateY(2px);box-shadow:none}
.mu-done{background:var(--ok-bg);border-color:var(--ok)}
.mu-doing{background:#fff6dc;border-color:#f0b429}
.mu-todo{background:#fff;border-color:#c3c9d2;border-style:dashed}
.mu-st{font-weight:800;font-size:1.05rem}
.mu-done .mu-st{color:#145c38}.mu-doing .mu-st{color:#5c4300}.mu-todo .mu-st{color:#4a5563}
.mu-t{font-size:1.05rem;line-height:1.35}
.mu-s{font-size:.85rem;color:var(--muted)}
.mu .pbar{height:12px}.mu-doing .pbar i{background:linear-gradient(90deg,#ffd166,#f0a020)}
.mu-need{font-size:.85rem;color:#5b4a1a;line-height:1.35}
.bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.bk{display:block;padding:12px 14px;border-radius:18px;border:2px solid var(--line);background:#fff;color:var(--ink);text-decoration:none}
.bk-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:800;font-size:1.1rem}
.bk-h small{font-weight:700;color:var(--muted);font-size:.9rem;white-space:nowrap}
.bk .pbar{margin:6px 0 8px;height:14px}.bk .pbar i{background:linear-gradient(90deg,#8ad3ff,#2b8fd6)}
.lvl{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;font-size:.9rem}
.lvl .pbar{height:10px;margin:0;border-width:1px}
.lvl span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
@media (max-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.mu{min-height:110px}.hero h1{font-size:1.35rem}}
</style>
</head>
<body>
<header class="mbar"><div class="mbar-in"><a class="brand" href="index.html">🎈 小朋友學習站</a><a class="btn" href="index.html" id="back">← 回學習站</a><span data-kids-auth-slot></span></div></header>
<main class="mwrap" id="map">
  <div class="hero"><h1>🗺️ 課程地圖</h1><p class="muted">一眼看出哪些單元學完了、還差哪些；點一格就會進到那個單元。</p></div>
  <section class="card" id="sum"></section>
  <div id="subjects-map"></div>
  <section class="card subj" id="bank-sec"></section>
</main>
<script src="data/words.js?v=8a1af48fb4"></script>
<script src="data/words-2.js?v=a5ff786cbb"></script>
<script src="data/words-3.js?v=bf18b2c492"></script>
<script src="data/words-4.js?v=b71a91b593"></script>
<script src="data/words-5.js?v=533efcd908"></script>
<script src="data/phrases.js?v=3853542ee5"></script>
<script src="data/roots.js?v=d7178ada4d"></script>
<script src="data/grammar.js?v=85cc7412bf"></script>
<script src="data/patterns.js?v=d5d5bbeff6"></script>
<script src="data/textbook.js?v=b3c3c2bdaf"></script>
<script src="engine.js?v=3ae6cf5f29"></script>
<script src="kids-auth.js?v=42d7c72a13"></script>
<script src="syncmerge.js?v=6b0cc80b23"></script>
<script src="completion.js?v=97da5fff3c"></script>
<script src="kids-done.js?v=877f66af0a"></script>
<script src="syncauto.js?v=d7ed49f73e"></script>
<script src="sync.js?v=cbdd56da2a"></script>
<script>
/* 課程地圖：判定全部在 completion.js（KidsCompletion.build）；本機紀錄由 kids-done.js 讀。
   免登入看這台裝置的紀錄；登入後 sync.js 會跟帳號同步，合併到新資料（kids-sync-updated）或別的分頁改了紀錄（storage → kids-done-changed）就重畫。 */
(function () {
  'use strict';
  var KC = window.KidsCompletion, KD = window.KidsDone;
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var bar = function (p) { return '<span class="pbar" role="presentation"><i style="width:' + Math.max(0, Math.min(100, p)) + '%"></i></span>'; };
  var ST = KC.STATUS_TEXT;
  function cell(u) {
    var need = u.status === 'doing' ? u.checklist.filter(function (c) { return !c.ok; }).map(function (c) { return c.label; }) : [];
    return '<a class="mu mu-' + u.status + '" href="' + esc(u.href) + '" data-key="' + esc(u.key) + '" data-status="' + u.status + '" aria-label="' + esc(u.title + '：' + KC.statusText(u)) + '">' +
      '<span class="mu-st">' + esc(KC.statusText(u)) + '</span><b class="mu-t">' + esc(u.title) + '</b>' + (u.sub ? '<span class="mu-s en">' + esc(u.sub) + '</span>' : '') +
      bar(u.pct) + (need.length ? '<small class="mu-need">還差：' + esc(need.join('、')) + '</small>' : '') + '</a>';
  }
  function who() {
    var A = window.KidsAuth, S = window.KESync, inn = false;
    try { inn = !!(A && A.configured() && A.isLoggedIn()); } catch (e) { }
    if (inn) return '☁️ 已登入：顯示這個帳號同步後的紀錄（iPad、電腦的紀錄會合在一起）。' + (S ? '<span class="sync-status muted"> ' + esc(S.statusText()) + '</span>' : '');
    return '📱 還沒登入：顯示這台裝置的紀錄。' + (A && A.configured() ? '<a href="' + esc(A.loginUrl(A.base + 'map.html')) + '">登入</a>後，同一個帳號的 iPad、電腦紀錄會合在一起。' : '');
  }
  function render() {
    var M = KC.build(KD.data(), KD.ctx());
    $('#sum').innerHTML = '<div class="sum"><div class="sum-big" id="sum-t">整體完成 <b>' + M.done + '</b> / ' + M.total + ' 個單元（' + M.pct + '%）</div>' + bar(M.pct) + '</div>' +
      '<ul class="legend" aria-label="圖例"><li class="mu-done">' + ST.done + '</li><li class="mu-doing">' + ST.doing + ' xx%（還差什麼寫在格子裡）</li><li class="mu-todo">' + ST.todo + '（虛線框）</li></ul>' +
      '<p class="who" id="who">' + who() + '</p>';
    $('#subjects-map').innerHTML = M.subjects.map(function (s) {
      var groups = s.k === 'english' ? s.units.reduce(function (o, u) { (o[u.group] = o[u.group] || []).push(u); return o; }, {}) : null;
      var body = groups ? Object.keys(groups).map(function (g) { return '<h3 class="book">' + esc(g || '課本') + '</h3><div class="grid">' + groups[g].map(cell).join('') + '</div>'; }).join('')
        : '<div class="grid">' + s.units.map(cell).join('') + '</div>';
      return '<section class="card subj" id="subj-' + s.k + '" data-done="' + s.done + '" data-total="' + s.total + '"><h2>' + s.icon + ' ' + esc(s.name) +
        '<span class="cnt' + (s.done === s.total ? ' all' : '') + '">' + s.done + '/' + s.total + ' 完成</span></h2>' + body + '</section>';
    }).join('');
    $('#bank-sec').innerHTML = '<h2>🔤 英文題庫（課本以外）<span class="cnt">只算學會百分比</span></h2><p class="muted">單字、片語、字根、文法、句型按「👍 學會了」並通過小測驗的比例；題庫很大，不算「完成」。</p><div class="bank">' +
      M.bank.map(function (b) {
        return '<a class="bk" href="' + esc(b.href) + '" id="bank-' + b.k + '"><div class="bk-h"><span>' + b.icon + ' ' + esc(b.label) + '</span><small>學會 ' + b.learned + '/' + b.total + '（' + b.pct + '%）</small></div>' + bar(b.pct) +
          (b.levels.length > 1 ? '<div class="lvl">' + b.levels.map(function (l) { return '<span>' + esc(l.label) + '</span>' + bar(l.pct) + '<span>' + l.learned + '/' + l.total + '（' + l.pct + '%）</span>'; }).join('') + '</div>' : '') + '</a>';
      }).join('') + '</div>';
    document.body.setAttribute('data-rendered', String(Date.now()));
  }
  var t = null;
  function soon() { clearTimeout(t); t = setTimeout(render, 60); }
  window.addEventListener('kids-done-changed', soon);      // 別的分頁／子框改了紀錄（kids-done.js 收 storage 事件後發）
  window.addEventListener('kids-sync-updated', soon);      // 自動同步合併到別台的紀錄
  window.addEventListener('kesync', function () { var w = $('#who'); if (w) w.innerHTML = who(); });
  window.addEventListener('pageshow', function (e) { if (e.persisted) render(); });   // 從單元按「上一頁」回來（iPad 的 bfcache）
  window.MapPage = { render: render };
  render();
})();
</script>
</body>
</html>
