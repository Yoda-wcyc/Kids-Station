<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff8ec">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<title>我的帳號 · 小朋友學習站</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23ffd166'/%3E%3Ctext x='90' y='120' font-size='86' text-anchor='middle' font-family='Arial,sans-serif' font-weight='bold' fill='%23263445'%3EAB%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=2ffff75a47">
<style>
.mbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:3px solid var(--line);box-shadow:0 2px 10px rgba(38,52,69,.06)}
.mbar-in{max-width:620px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px}
.mbar-in .brand{flex:1;font-size:1.1rem;font-weight:800;color:var(--ink);text-decoration:none}
.wrapm{max-width:620px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
.hero{text-align:center;margin:6px 0 14px}.hero .big-i{font-size:3rem;line-height:1.2}.hero h1{font-size:1.45rem}
.info{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;margin:0}
.info dt{color:var(--muted);font-size:.95rem;white-space:nowrap}.info dd{margin:0;font-weight:700;word-break:break-all}
.fld{display:block;margin:0 0 14px}.fld>span{display:block;font-weight:700;margin:0 0 6px}
.fld small{display:block;color:var(--muted);font-size:.85rem;margin-top:4px}
.inp{width:100%;min-height:56px;font:inherit;font-size:1.05rem;padding:8px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
.inp:focus{outline:3px solid #ffd6b8;border-color:var(--pri)}
.msg{border-radius:14px;padding:12px 14px;margin:0 0 14px;font-weight:600}
.msg.bad{background:var(--no-bg);color:#a3262a;border:2px solid #f5c2c3}
.msg.good{background:var(--ok-bg);color:#1d7a48;border:2px solid #b5e8cb}
.msg.info{background:#fff8ec;border:2px solid var(--line)}
.msg[hidden],[hidden]{display:none!important}
.pw{display:flex;gap:8px}.pw .inp{flex:1;min-width:0}.btn.eye{min-width:104px;min-height:56px;padding:0 12px;font-size:1rem;white-space:nowrap}
/* 🪙 學習幣卡 */
.coin-top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;margin:0 0 14px}
.coin-big{display:flex;align-items:baseline;gap:6px}.coin-big span{font-size:2.2rem}.coin-big b{font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}.coin-big small{color:var(--muted)}
.goalbox{background:#fff8ec;border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 14px}
.goal-t{font-weight:800;margin:0 0 8px}
.goal-bar{height:16px;border-radius:999px;background:#fff;border:2px solid var(--line);overflow:hidden}
.goal-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd166,#ff8a3d);transition:width .4s}
.goalbox.met .goal-bar i{background:linear-gradient(90deg,#69db7c,#2f9e44)}
.goal-s{margin:6px 0 0;font-size:.92rem;color:var(--muted)}
.ctab{width:100%;border-collapse:collapse;font-size:.95rem}
.ctab th,.ctab td{border-bottom:1.5px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.ctab th{color:var(--muted);font-weight:700}
.ctab td.d{text-align:right;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}.ctab td.d.up{color:#1d7a48}.ctab td.d.down{color:#a3262a}
.ctab td.t{white-space:nowrap;color:var(--muted)}.ctab small{display:block;color:var(--muted);word-break:break-all}
</style>
</head>
<body data-kids-widget="off">
<header class="mbar"><div class="mbar-in"><a class="brand" href="index.html">🎈 小朋友學習站</a><a class="btn" href="index.html">← 回學習站</a></div></header>
<main class="wrapm">
  <div class="hero"><div class="big-i">🧑‍🏫</div><h1>我的帳號</h1></div>
  <p class="msg" id="msg" role="status" aria-live="polite" hidden></p>

  <section class="card center" id="out" hidden>
    <p id="out-t">還沒有登入喔！</p>
    <a class="btn primary big" id="out-go" href="login.html">🔑 去登入</a>
  </section>

  <div id="in" hidden>
    <section class="card">
      <h2>👋 帳號資料</h2>
      <dl class="info">
        <dt>會員編號</dt><dd id="v-pub"></dd>
        <dt>帳號（email）</dt><dd id="v-email"></dd>
        <dt>暱稱</dt><dd id="v-kid"></dd>
        <dt>年齡</dt><dd id="v-age"></dd>
        <dt>年級</dt><dd id="v-grade"></dd>
        <dt>登入有效到</dt><dd id="v-exp"></dd>
      </dl>
      <p class="muted" style="margin:12px 0 0">每個月有來練習，登入就會自動延長，不用常常重新登入。</p>
    </section>

    <div id="plan-slot"></div>

    <section class="card" id="coins">
      <h2>🪙 學習幣</h2>
      <div class="coin-top">
        <div class="coin-big" aria-label="學習幣餘額"><span>🪙</span><b id="c-bal">…</b><small>枚</small></div>
        <dl class="info"><dt>連續達標</dt><dd id="c-streak">—</dd><dt>本週請假卡</dt><dd id="c-leave">—</dd></dl>
      </div>
      <div class="goalbox" id="c-goal">
        <p class="goal-t" id="c-goal-t">今天有效學習 0 / 15 分</p>
        <div class="goal-bar" role="progressbar" aria-valuemin="0" aria-valuemax="15" aria-valuenow="0" id="c-goal-bar"><i></i></div>
        <p class="goal-s">一分鐘裡有作答就算 1 分鐘；滿 15 分鐘就達標，會拿到每日達標學習幣。</p>
      </div>
      <h3 style="margin:0 0 6px">最近明細</h3>
      <table class="ctab"><thead><tr><th>時間</th><th>項目</th><th style="text-align:right">學習幣</th></tr></thead><tbody id="c-recent"><tr><td colspan="3" class="muted">讀取中…</td></tr></tbody></table>
      <p class="muted" id="c-msg" style="margin:8px 0 0" hidden></p>
    </section>

    <form class="card" id="f-pw" novalidate>
      <h2>🔒 改密碼</h2>
      <label class="fld"><span>現在的密碼</span><span class="pw"><input class="inp" type="password" name="old" autocomplete="current-password" required><button type="button" class="btn eye" data-eye aria-label="顯示密碼" aria-pressed="false">👀 顯示</button></span></label>
      <label class="fld"><span>新密碼</span><span class="pw"><input class="inp" type="text" name="new1" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false" minlength="6" required><button type="button" class="btn eye" data-eye aria-label="隱藏密碼" aria-pressed="true">🙈 隱藏</button></span><small>要 6 個字以上，而且要有英文字母和數字喔！</small></label>
      <label class="fld"><span>再輸入一次新密碼</span><span class="pw"><input class="inp" type="text" name="new2" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false" required><button type="button" class="btn eye" data-eye aria-label="隱藏密碼" aria-pressed="true">🙈 隱藏</button></span></label>
      <button class="btn primary big wide" type="submit">改密碼</button>
    </form>

    <section class="card">
      <h2>🚪 登出</h2>
      <p class="muted">登出後還是可以看介紹和讀講義；要開始練習、玩遊戲時再登入就好。</p>
      <button class="btn big wide danger" type="button" id="logout">登出這台裝置</button>
    </section>
  </div>
  <p class="center muted" style="margin:18px 0 0"><a href="terms.html">📄 使用條款與隱私權說明</a></p>
</main>
<script src="kids-auth.js?v=16915da323"></script>
<script src="kids-coins.js?v=747b1f93cc"></script>
<script>
(function () {
  'use strict';
  var A = window.KidsAuth;
  var $ = function (s) { return document.querySelector(s); };
  var msg = $('#msg');
  function say(text, kind) { msg.textContent = text || ''; msg.className = 'msg ' + (kind || 'bad'); msg.hidden = !text; }
  function fmt(sec) {
    if (!sec) return '—';
    try { return new Date(sec * 1000).toLocaleDateString('zh-TW', { timeZone: 'Asia/Taipei', year: 'numeric', month: 'long', day: 'numeric' }); } catch (e) { return new Date(sec * 1000).toISOString().slice(0, 10); }
  }
  // 顯示／隱藏密碼（設定新密碼的欄位預設明碼，避免小朋友打錯還不知道；登入與舊密碼預設遮住）
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-eye]'); if (!b) return;
    var inp = b.parentNode.querySelector('input'), show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    b.textContent = show ? '🙈 隱藏' : '👀 顯示'; b.setAttribute('aria-label', show ? '隱藏密碼' : '顯示密碼'); b.setAttribute('aria-pressed', show ? 'true' : 'false');
  });
  function showOut(text) { $('#in').hidden = true; $('#out').hidden = false; $('#out-t').textContent = text; $('#out-go').href = A.loginUrl(A.base + 'account.html'); }
  function draw(m) {
    $('#out').hidden = true; $('#in').hidden = false;
    $('#v-pub').textContent = m.pub_id || '—';
    $('#v-email').textContent = m.email || '—';
    $('#v-kid').textContent = m.child_nickname || '小朋友';
    $('#v-age').textContent = m.age ? m.age + ' 歲' : '—';
    $('#v-grade').textContent = A.gradeText(m.grade) || '—';
    $('#v-exp').textContent = fmt(A.exp());
  }
  if (!A.configured()) { showOut('會員系統還在準備中，現在不用登入也可以練習和玩遊戲喔！'); $('#out-go').hidden = true; return; }
  if (!A.isLoggedIn()) { showOut('還沒有登入喔！'); return; }
  draw(A.member() || {});

  // ---------- 🪙 學習幣卡：餘額、連續天數、請假卡、今日有效分鐘、最近 20 筆 ----------
  var C = window.KidsCoins;
  function fmtTs(ts) {
    var n = Number(ts), d = isFinite(n) && String(ts).trim() !== '' ? new Date(n < 1e12 ? n * 1000 : n) : new Date(ts);
    if (isNaN(d.getTime())) return '—';
    try { return d.toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }); } catch (e) { return d.toISOString().slice(5, 16).replace('T', ' '); }
  }
  function cell(tr, cls, text, sub) { var td = document.createElement('td'); if (cls) td.className = cls; td.textContent = text; if (sub) { var s = document.createElement('small'); s.textContent = sub; td.appendChild(s); } tr.appendChild(td); }
  function setBal(v) { if (typeof v === 'number') $('#c-bal').textContent = v; }
  function drawCoins(r) {
    setBal(r.balance);
    $('#c-streak').textContent = (+r.streak_days || 0) + ' 天';
    $('#c-leave').textContent = +r.leave_cards > 0 ? '有 🎫' : '已用';
    var t = r.today || {}, mins = Math.max(0, +t.minutes || 0), met = !!t.goal_met, shown = Math.min(15, mins);
    $('#c-goal').classList.toggle('met', met);
    $('#c-goal-t').textContent = met ? '✅ 今天達標了！有效學習 ' + mins + ' 分鐘' : '今天有效學習 ' + shown + ' / 15 分';
    var bar = $('#c-goal-bar'); bar.setAttribute('aria-valuenow', String(shown)); bar.firstChild.style.width = (shown / 15 * 100) + '%';
    var tb = $('#c-recent'); tb.innerHTML = '';
    var rows = (r.recent || []).slice(0, 20);
    if (!rows.length) { var tr0 = document.createElement('tr'); cell(tr0, 'muted', '還沒有學習幣紀錄，去練習就會有喔！'); tr0.firstChild.colSpan = 3; tb.appendChild(tr0); }
    rows.forEach(function (x) {
      var tr = document.createElement('tr'), d = +x.delta || 0;
      cell(tr, 't', fmtTs(x.ts));
      cell(tr, '', x.label || x.rule_id || '—', x.note || x.item || '');
      cell(tr, 'd ' + (d >= 0 ? 'up' : 'down'), (d >= 0 ? '+' : '−') + Math.abs(d) + ' 🪙');
      tb.appendChild(tr);
    });
  }
  function loadCoins() {
    return A.api('getCoins', { token: A.token(), limit: 20 }).then(function (r) { $('#c-msg').hidden = true; drawCoins(r); }, function (x) {
      if (x.code === 'expired' || x.code === 'revoked') { A.logout(); showOut(A.errorText(x.code)); return; }
      var cm = $('#c-msg'); cm.hidden = false; cm.textContent = '學習幣明細暫時讀不到：' + A.errorText(x.code);
      $('#c-recent').innerHTML = '';
      if (C && typeof C.balance() === 'number') setBal(C.balance());
    });
  }
  if (C) { if (typeof C.balance() === 'number') setBal(C.balance()); C.onChange(function (v) { setBal(v); }); }
  // 先把這台裝置還沒送出的學習幣事件送掉，再拿明細（明細才會是最新的）
  (C ? C.flush() : Promise.resolve()).then(loadCoins, loadCoins);
  // 向後端拿最新資料（也順便確認票還有效）
  A.api('memberProfile', { token: A.token() }).then(function (r) {
    var cur = A.member() || {};
    A.saveSession({ token: A.token(), exp: A.exp(), member: Object.assign(cur, r.member || {}) });
    draw(A.member() || {});
  }, function (x) {
    if (x.code === 'expired' || x.code === 'revoked') { A.logout(); showOut(A.errorText(x.code)); }
    else say(A.errorText(x.code) + '（下面先顯示這台裝置記得的資料）', 'info');
  });

  // ---------- 會員方案卡（ECPAY_CONTRACT §0-1、§4）：只有後端說 open=true，或這個帳號真的付過款，才畫出來；否則 #plan-slot 保持空白 ----------
  var PST = { active: '✅ 使用中', cancelled: '已取消自動扣款（用到期末）', expired: '已到期', pending: '⏳ 待開通', refunded: '已退款', inactive: '免費會員' };
  function fmtDay(v) {
    if (!v) return '—';
    var s = String(v), m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
    if (m) return +m[1] + ' 年 ' + +m[2] + ' 月 ' + +m[3] + ' 日';
    var d = new Date(isFinite(+s) && s.trim() !== '' ? (+s < 1e12 ? +s * 1000 : +s) : s);
    if (isNaN(d.getTime())) return s;
    try { return d.toLocaleDateString('zh-TW', { timeZone: 'Asia/Taipei', year: 'numeric', month: 'long', day: 'numeric' }); } catch (e) { return d.toISOString().slice(0, 10); }
  }
  function money(n) { n = Number(n); return isFinite(n) && n > 0 ? 'NT$ ' + n.toLocaleString('en-US') : ''; }
  function hasPay(r) { var lp = r.last_payment; return !!(lp && (lp.trade_no || lp.ts)) || r.has_payments === true; }
  function paidBefore(r) { return hasPay(r) || r.status === 'active' || r.status === 'cancelled'; }
  // 付費有效＝後端 isPaidActive（paid 欄）；舊後端沒這欄時，用 active／取消後還在期內推估
  function paidActive(r) { return typeof r.paid === 'boolean' ? r.paid : (r.status === 'active' || (r.status === 'cancelled' && r.cancel_pending === true)); }
  function drawPlan(r) {
    var slot = $('#plan-slot'); slot.innerHTML = '';
    if (!r || !(r.open === true || paidBefore(r))) return;
    var sec = document.createElement('section'); sec.className = 'card'; sec.id = 'plan';
    var h = document.createElement('h2'); h.textContent = '💳 會員方案'; sec.appendChild(h);
    var dl = document.createElement('dl'); dl.className = 'info';
    function row(k, v, id) { var dt = document.createElement('dt'), dd = document.createElement('dd'); dt.textContent = k; dd.textContent = v; if (id) dd.id = id; dl.appendChild(dt); dl.appendChild(dd); }
    var cancelled = r.status === 'cancelled' || r.cancel_pending === true;
    row('方案', (r.plan ? r.plan + ' · ' : '') + '學期會員' + (money(r.amount) ? '（每學期 ' + money(r.amount) + '）' : ''), 'p-plan');
    var free = !hasPay(r) && (!r.status || r.status === 'pending' || r.status === 'inactive'); // 註冊後一律 pending：沒付過款就是免費會員
    row('狀態', free ? '免費會員' : r.cancel_pending === true && r.status !== 'cancelled' ? '取消處理中' : (PST[r.status] || r.status || '—'), 'p-status');
    if (r.next_charge_date) row(cancelled ? '可以用到' : '下次扣款日', fmtDay(r.next_charge_date), 'p-next');
    if (+r.paid_periods > 0) row('已付期數', r.paid_periods + ' 期', 'p-periods');
    var lp = r.last_payment;
    row('上次付款', lp && (lp.ts || lp.trade_no) ? fmtDay(lp.ts) + (money(lp.amount) ? ' · ' + money(lp.amount) : '') : '還沒有付款紀錄', 'p-last');
    sec.appendChild(dl);
    var note = document.createElement('p'); note.className = 'muted'; note.style.margin = '12px 0 0';
    note.innerHTML = '每學期自動扣款；扣款後 7 天內可以申請退款；取消後不會再扣下一期，這一期可以用到期末。詳細規則請看<a href="terms.html#s8">使用條款第八節</a>。';
    sec.appendChild(note);
    // 開放訂閱後、這個帳號目前不是付費有效 → 給一顆按鈕去 subscribe.html（open=false 時整張卡本來就不畫，按鈕也不會出現）
    if (r.open === true && !paidActive(r)) {
      var go = document.createElement('a'); go.className = 'btn primary big wide'; go.id = 'p-subscribe'; go.style.marginTop = '12px';
      go.href = 'subscribe.html'; go.textContent = '👉 看看會員方案';
      sec.appendChild(go);
    }
    if (r.can_cancel === true && !cancelled) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'btn big wide danger'; b.id = 'p-cancel'; b.style.marginTop = '12px'; b.textContent = '取消自動扣款';
      b.addEventListener('click', function () {
        var until = r.next_charge_date ? fmtDay(r.next_charge_date) : '這一期結束';
        if (!confirm('要取消自動扣款嗎？\n取消後不會再扣下一期，會員可以用到 ' + until + '。')) return;
        if (!confirm('再確認一次：真的要取消自動扣款嗎？')) return;
        b.disabled = true; say('處理中…', 'info');
        A.api('requestCancel', { token: A.token() }).then(function (x) {
          say('已經取消自動扣款，會員可以用到 ' + fmtDay(x.until || r.next_charge_date) + '。', 'good');
          loadPlan();
        }, function (x) {
          b.disabled = false;
          if (x.code === 'expired' || x.code === 'revoked') { A.logout(); showOut(A.errorText(x.code)); return; }
          say('取消沒有成功：' + A.errorText(x.code) + ' 也可以來信 iamtwispin@gmail.com 請我們幫忙。');
        });
      });
      sec.appendChild(b);
    }
    slot.appendChild(sec);
  }
  function loadPlan() {
    return A.api('memberSubscription', { token: A.token() }).then(drawPlan, function () { $('#plan-slot').innerHTML = ''; }); // 讀不到（含後端還沒這個 action）＝不顯示
  }
  loadPlan();

  $('#f-pw').addEventListener('submit', function (e) {
    e.preventDefault(); var f = e.target;
    if (!f.old.value) return say('請輸入現在的密碼。');
    var pwBad = A.checkPassword(f.new1.value); if (pwBad) return say(A.errorText(pwBad));
    if (f.new1.value !== f.new2.value) return say('兩次輸入的新密碼不一樣，請再輸入一次。');
    var all = f.querySelectorAll('input,button'); all.forEach(function (x) { x.disabled = true; }); say('處理中…', 'info');
    A.api('changePassword', { token: A.token(), old_password: f.old.value, new_password: f.new1.value }).then(function (r) {
      A.saveSession(r); f.reset(); all.forEach(function (x) { x.disabled = false; });
      draw(A.member() || {}); say('密碼改好了！其他裝置下次要用新密碼登入。', 'good');
    }, function (x) {
      all.forEach(function (y) { y.disabled = false; });
      if (x.code === 'expired' || x.code === 'revoked') { A.logout(); showOut(A.errorText(x.code)); return; }
      say(x.code === 'bad_credentials' ? '現在的密碼不對，請再試一次。' : A.errorText(x.code));
    });
  });
  $('#logout').addEventListener('click', function () {
    A.logout(); say('已經登出了，下次要練習時再登入就好。', 'good'); showOut('已經登出了。');
  });
})();
</script>
</body>
</html>
